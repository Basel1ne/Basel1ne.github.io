(서술형) 세종 과학기지와 비교할 때 장보고 과학기지가 가지는 입지적 장점과 이로 인해 가능해진 대표적 연구 분야 2가지를 서술하시오.|입지적 장점: 세종기지는 남극 대륙과 떨어진 킹조지섬에 위치한 반면, 장보고기지는 남극 대륙 본토(동남극 테라노바만)에 위치하여 대륙 내부로 진출하는 거점이 됩니다.¶연구 분야: 대륙 내부의 빙하 시추, 운석 탐사, 고의도 우주 환경 연구, 로스해 해양 생태계 보전 연구 등이 가능해졌습니다.|
(서술형) K루트(Korean Route) 프로젝트의 정의와 이 프로젝트가 남극 극지 탐사에서 갖는 과학적 의의를 설명하시오.|정의: 장보고 과학기지에서 남극 대륙 내륙 깊숙이 진출하기 위해 캐러밴 등을 이용해 개척한 육상 수송 경로(현재 2,215km)입니다.¶과학적 의의: 항공 운송의 기상 제약을 극복하고 안정적으로 보급품과 연구 장비를 수송하여, 남극 내륙 빙하 시추, 림노 호수 시추, 운석 탐사 등 장기적이고 광범위한 내륙 연구를 가능하게 합니다.|`,
`(단답형) 태양이 고체가 아니기 때문에 위도나 위치에 따라 자전 회전각속도가 다르게 나타나는 현상을 무엇이라 하는가?|차등 회전 (Differential Rotation)|차등 회전으로 인해 태양 자기장이 휘감기고 뒤틀려 흑점이 형성됩니다.
(단답형) 1645년부터 1715년까지 흑점 수가 극단적으로 감소하여 영국 템스강이 얼어붙는 등 유럽과 세계에 강추위가 찾아왔던 시기를 무엇이라 부르는가?|소빙하기 (Maunder Minimum / Little Ice Age)|흑점 극소기와 지구 기온 강하의 대표적 역사적 사례입니다.
(단답형) 태양 활동 지표 중 고에너지 입자가 지구로 쏟아져 인공위성 회로 파손 및 우주비행사/항공기 승무원의 피폭을 유발하는 폭풍 현상은?|태양 방사선 폭풍 (Solar Radiation Storm)|고에너지 양성자 입자 유입에 따른 우주/항공 방사선 피폭 지표입니다.
(서술형) 태양 극대기에 발생하는 '지자기 폭풍(Geomagnetic Storm)'의 발생 원인과 이로 인해 지구 지상 및 우주 인프라에 미치는 피해 2가지를 서술하시오.|발생 원인: 태양 플레어 및 코로나 질량 방출로 분출된 자기장과 입자들이 지구 자기장을 흔들어 극심한 요동을 일으키기 때문입니다.¶피해 내용: 1) 송배전망에 강한 유도전류를 발생시켜 대규모 정전 사태 유발, 2) 위성 항법 시스템(GPS) 오작동 및 위성 궤도 추락, 철도 신호 오작동 발생.|
(서술형) 북극 항로를 이용하는 장거리 국제선 항공기 탑승 시 우주 방사선 피폭 노출을 최소화하기 위한 실천 방법 3가지를 서술하시오.|창가 좌석보다 벽에서 떨어진 복도 좌석을 이용합니다 (창가가 차단 효과가 낮음).¶고의도(북극) 노선 대신 저위도(적도 근처) 노선을 선택합니다.¶비행 고도가 높고 시간이 긴 장거리 비행 빈도를 줄이거나, 임신 초기 3개월 동안은 장거리 비행을 자제합니다.|`,
`(단답형) 무역풍이 약해지면서 적도 동태평양 해수면 온도가 평년보다 높아져 동쪽 페루 연안에 호우를, 서쪽 인도네시아에 가뭄을 부르는 자연 현상의 명칭은?|엘리뇨 (El Niño)|무역풍 약화와 동태평양 수온 상승이 초래하는 대규모 해양-대기 이상 현상입니다.
(단답형) 무역풍이 강해지면서 적도 동태평양의 차가운 심해수가 올라와 해수면 온도가 평년보다 낮아지는 기상 현상은 무엇인가?|라니냐 (La Niña)|엘리뇨와 반대로 동태평양 수온이 낮아지고 서태평양 수온이 높아지는 현상입니다.
(단답형) 기후 시스템에서 작은 변화들이 쌓여 일정 임계점을 넘어서면 예측할 수 없는 변화가 일어나 이전 상태로 되돌릴 수 없게 되는 지점을 무엇이라 하는가?|기후 티핑 포인트 (Climate Tipping Point)|기후 시스템의 불가역적 변화가 시작되는 임계점입니다.
(서술형) 엘리뇨 현상이 발생했을 때 미국 남서부 지대에서 한타 바이러스 및 패스트와 같은 감염병이 확산된 기후적/생태적 매개 과정을 설명하시오.|기후/생태 과정: 엘리뇨로 인한 강수량 증가 및 기온 변화가 초목 성장을 촉진하여, 매개체인 쥐(설치류)에게 풍부한 먹이를 제공했습니다.¶감염 경로: 개체수가 급증한 쥐와 인간의 접촉이 늘며 오염 배설물을 통해 한타 바이러스가 전파되었고, 쥐에 기생하는 벼룩이 늘어나며 패스트 발병률이 촉진되었습니다.|
(서술형) 라니냐가 발생했을 때 대한민국 여름철과 겨울철에 각각 나타나는 대표적 기상 특성과 그로 인한 사회/경제적 영향을 서술하시오.|여름철: 북태평양고기압 발달로 남서쪽 수증기가 다량 유입되어 폭우와 홍수(예: 2010년 서울 집중호우)가 발생하고, 도로/주택 침수 및 농작물 침수 피해를 줍니다.¶겨울철: 시베리아고기압이 강해져 북극 찬 공기가 유입되어 기록적인 한파가 지속되고, 난방 에너지 수요 급증 및 농축수산업 냉해 피해가 발생합니다.|`,
`(단답형) 매니큐어 제거 시 사용되는 아세톤이나 미용실의 포름알데히드 기체를 일반 마스크로 거를 수 없는 이유(분자적 특성)는 무엇인가?|분자 크기가 바이러스나 마스크 기공 크기보다 훨씬 작기 때문.|유기 용제 분자는 바이러스보다 크기가 작아 마스크를 그대로 통과하므로 환기가 필수적입니다.
(단답형) 고탄수화물 식품을 120도 이상의 고온에서 장시간 튀기거나 조리할 때 생성되는 발암 물질의 명칭은?|아크릴아마이드 (Acrylamide)|감자칩, 프라이드치킨 등 고온 조리 시 발생하는 발암성 화학 물질입니다.
(단답형) 캔음료 내부 금속 부식을 막기 위한 에폭시 수지 코팅의 원료로 사용되며, 뜨거운 캔커피 등에서 용출 위험이 관리되는 환경호르몬 물질은?|비스페놀 A (BPA / Bisphenol A)|에폭시 수지 제조 원료이자 관리 기준(0.6 ppm)이 존재하는 물질입니다.
(서술형) 가정에서 가스레인지(도시가스 메테인) 사용 시 산소가 부족할 경우 발생하는 유독가스와, 요리 시 건강을 지키기 위한 2가지 필수 안전 수칙을 서술하시오.|유독가스: 일산화탄소 (CO)¶안전 수칙: 1) 요리 시작 전 주방 창문을 열어 환기 상태를 유지한다. 2) 레인지 후드(환풍기)를 반드시 작동시켜 유해가스를 배출한다.|
(서술형) 숯불구이집에서 참나무 숯 대신 사용하는 '합성탄'이 인체에 유해한 가스를 배출하는 화학적 원리와 과정을 설명하시오.|화학적 원리: 폐목재에 화학약품과 착화제로 질산 바륨(Barium nitrate)을 넣어 성형합니다.¶과정: 숯불을 피워 합성탄이 탈 때 착화제인 질산 바륨도 함께 연소하면서 자동차 배기가스 주성분인 이산화 질소(NO2)가 다량 발생하여 손님과 종사자의 폐로 흡입됩니다.|`,
`(단답형) 1945년 7월 16일 미국 뉴멕시코 사막에서 성공한 인류 최초의 핵무기 실험 코드명은 무엇인가?|트리니티 실험 (Trinity Test)|맨해튼 프로젝트에 의해 진행된 최초의 원자폭탄 폭발 실험입니다.
(단답형) 1932년 제임스 채드윅이 발견하였으며, 전하를 띠지 않아 원자핵 반발 없이 우라늄 핵분열 연쇄 반응을 유도할 수 있게 한 입자는?|중성자 (Neutron)|양성자와 질량이 같고 전하가 없어 핵분열 연쇄 반응의 핵심이 된 입자입니다.
(단답형) 2차 세계대전 승전 후 미국 정보기관(JIOA)이 V2 로켓 개발자 베르너 폰 브라운을 비롯한 독일 우수 과학자들을 포섭한 비밀 작전명은?|페이퍼클립 작전 (Operation Paperclip)|미·소 냉전 진입 전 독일 기술진을 영입한 미국의 비밀 작전입니다.
(서술형) 핵분열(Fission)과 핵융합(Fusion)의 반응 원리상의 차이점과 각각에 사용되는 주요 원소를 비교하여 설명하시오.|반응 원리: 핵분열은 우라늄·플루토늄 같은 무거운 원자핵이 중성자 충돌로 두 개의 가벼운 핵으로 쪼개지며 에너지를 냅니다. 반면, 핵융합은 수소·중수소 같은 가벼운 원자핵들이 초고온·초고압에서 합쳐져 무거운 핵이 되며 에너지를 방출합니다.¶사용 원소: 핵분열은 우라늄-235, 플루토늄-239를 사용하며, 핵융합은 중수소, 삼중수소를 사용합니다.|
(서술형) 수소폭탄이 작동하기 위해 내부에 원자폭탄(핵분열)을 뇌관으로 탑재해야 하는 물리적 이유를 설명하시오.|물리적 이유: 수소 원자핵끼리 반발력을 극복하고 핵융합 반응을 일으키려면 최소 1억 도 이상의 초고온 환경이 필수적입니다.¶역할: 지상이나 일반 폭약으로는 1억 도를 구현할 수 없으므로, 안쪽에서 원자폭탄(핵분열)을 먼저 터뜨려 발생하는 순간적인 극초고온과 고압을 기폭 에너지로 활용합니다.|`,
`(단답형) 프랑스 발명가 니콜라 아페르가 샴페인 병과 코르크 마개를 이용해 개발하여 장기 출정 식량 보급에 기여한 보관법은?|병조림 (Bottle canning)|끓는물 가열과 코르크 밀봉으로 방구제 없이 3주 이상 음식을 보관하는 기술입니다.
(단답형) 1812년 나폴레옹의 러시아 원정 시 영하 38도의 극한 호한에서 군복의 은색 주석 단추가 회색 가루로 부서진 화학적 변성 현상을 무엇이라 부르는가?|주석병 (Tin pest)|극저온에서 주석의 결정 구조가 변해 가루로 으스러지는 저온 부식 현상입니다.
(단답형) 영국 부검 소견서의 '5.2 피트' 기록으로 인해 나폴레옹이 단신으로 오인받은 이유가 된 도량형 상의 원인은?|영국과 프랑스의 피트(Feet) 및 인치(Inch) 단위 기준 차이.|프랑스의 1피트(32.48cm)가 영국의 1피트(30.48cm)보다 커서 발생한 치수 오해입니다.
(서술형) 나폴레옹이 포병 출신으로서 프랑스군 대포 운영 및 보급 효율성을 높이기 위해 실시한 포병 개혁 내용 2가지를 서술하시오.|포신과 구경의 크기를 줄여 대포의 무게를 가볍게 만듦으로써 포병대의 기동성을 크게 향상시켰습니다.¶포탄의 무게 규격을 12파운드, 8파운드, 4파운드 등으로 통일·표준화하여 현장에서 원하는 포탄을 빠르게 발사할 수 있게 했습니다.|
(서술형) 나폴레옹의 생가인 코르시카 섬이 프랑스 영토가 된 역사적 과정과, 1769년 태어난 나폴레옹의 출생 배경을 설명하시오.|역사적 과정: 원래 제노바 공국의 속국이던 코르시카는 독립 투쟁을 벌였으나, 1768년 제노바 공국이 관리의 귀찮음으로 프랑스에 헐값으로 섬을 매각하고 프랑스군이 상륙하여 점령했습니다.¶출생 배경: 코르시카가 프랑스 영토로 넘어간 직후인 1769년 8월 15일, 법대 출신 샤를 보나파르트와 레테지아 사이에서 나폴레옹이 프랑스 국적으로 태어나게 되었습니다.|`,
`(단답형) 옥스퍼드 대학교 출신 데미스 허사비스 등이 창업하였으며, 2016년 이세돌 9단과의 바둑 대결로 AI 시대를 연 '알파고'를 개발한 기업명은?|구글 딥마인드 (Google DeepMind)|옥스퍼드/케임브리지 출신이 창업하고 구글이 인수한 대표적 AI 스타트업입니다.
(단답형) 빛의 굴절률을 인공적으로 조작하여 해리 포터의 '투명망토'처럼 물체를 감출 수 있는 특성을 가진 첨단 신소재 분야는?|메타물질 (Metamaterial)|캐나다 퀀텀 스텔스 등이 시연한 투명 스텔스 기술의 핵심 소재입니다.

(서술형) 영국 옥스퍼드 대학교가 지닌 독특한 대학 운영 구조(칼리지 연합 형태)와 이것이 도시 전체의 분위기 형성에 미친 영향을 설명하시오.|운영 구조: 중앙 본부 단일 캠퍼스가 아니라, 30여 개의 독립된 칼리지(College)들이 각각 자체 기숙사, 도서관, 강의실을 갖추고 자율적으로 운영되는 연합 형태입니다.¶도시에 미친 영향: 칼리지 건물들이 도시 곳곳에 분산되어 있어 도시와 대학이 깊게 일체화되어 있고, 고풍스러운 분위기를 풍기며 인구의 20% 이상이 학생으로 구성된 학문 도시가 되었습니다.|
(서술형) 미국 로스앨러모스 국립연구소가 직면한 최근의 국가 안보 문제인 '인재 유출(로스앨러모스 클럽)'의 실태와 이에 대응하는 미국의 조치를 서술하시오.|인재 유출 실태: 지난 35년간 중국 공산당이 로스앨러모스 출신 최고급 과학자 160여 명을 스카우트하여 미사일 및 군사 기술 연구에 투입하였으며, 이들이 '로스앨러모스 클럽'을 형성했습니다.¶미국의 조치: 과학자 양성 심사를 강화하고 심사 기준을 엄격히 하며, 핵심 연구 및 기밀 접근에 중국인 등 외국인의 참여를 제한하는 안보 조치를 취하고 있습니다.|`,
`(단답형) 덴마크 코펜하겐에 위치하며, 쓰레기 소각장 지붕에 스키장과 레저 시설을 설치하여 시민 친화형 친환경 발전소로 유명한 시설의 명칭은?|아마게르 바케 (Amager Bakke / CopenHill)|쓰레기 소각열로 전력과 난방을 공급하고 지붕은 스키장으로 활용하는 혁신 시설입니다.

(서술형) 덴마크 정부가 수송 분야 탄소 중립을 달성하기 위해 친환경 이동 수단(자전거 및 전기차)에 제공하는 정책적 지원 지원 2가지를 서술하시오.|자전거 고속도로망(현재 200km 구축)을 조성하여 자동차보다 빠르고 안전한 출퇴근 인프라를 제공합니다.¶일반 자동차 구매 시 부과되는 180%의 고율 등록세를 전기차 구매 시 전액 면제해 주는 파격적인 세제 혜택을 제공합니다.|
(서술형) 고대 알렉산드리아 도서관이 단순한 책 보관소를 넘어 고대 세계 학문 발전에 기여한 역할과 현대 알렉산드리아가 직면한 기후변화 위기를 서술하시오.|고대 도서관의 역할: 수십만 권의 파피루스를 수집함은 물론 유클리드, 아르키메데스, 에라토스테네스 등 전 세계 학자들이 모여 철학, 의학, 수학, 천문학을 통합 연구·교육한 최초의 종합 학문 중심지 역할을 했습니다.¶현대 기후 위기: 지구 온난화로 지중해 해수면 상승 속도가 가속화(매년 3.2mm 상승)되면서 도시 침수와 연안 침식, 물부족이라는 심각한 기후 위기에 직면해 있습니다.|`,
`(단답형) 2024년 10월 "역사적 트라우마에 맞서고 인간 삶의 연약함을 드러낸 강렬한 시적 산문"이라는 한림원의 찬사 속에서 한국인 최초 / 아시아 여성 최초로 노벨 문학상을 수상한 소설가는?|한강 (Han Kang)|2000년 김대중 대통령 평화상에 이어 24년 만에 탄생한 한국의 두 번째 노벨상 수상자입니다.
(단답형) 스웨덴 스톡홀름 솔나 지역을 중심으로 스코네 및 덴마크 동부를 연결하며 형성된 북유럽 최대의 생명과학/제약 클러스터의 명칭은?|메디콘 밸리 (Medicon Valley)|아스트라제네카 등 세계적 제약 바이오 기업들이 상주하는 생명과학 클러스터입니다.
(단답형) 매년 알프레드 노벨의 서거일인 12월 10일 스톡홀름 콘서트홀에서 시상식이 끝난 후, 스톡홀름 시청(Blue Hall)에서 새벽까지 이어지는 공식 행사는?|노벨상 기념 만찬 (Nobel Banquet)|국왕, 수상자, 학자들이 참석하여 TV로 중계되는 노벨상 축제 만찬입니다.
(서술형) 알프레드 노벨이 유산을 기부하여 노벨상을 제정하게 된 역사적 배경과 노벨 평화상 시상식만 노르웨이에서 열리는 이유를 서술하시오.|제정 배경: 노벨은 건설 및 광산용으로 다이너마이트를 개발하여 큰 부를 쌓았으나, 이것이 전쟁 파괴 무기로 쓰이는 것에 가책을 느껴 유산(약 2,700억 원)을 기탁하여 인류 복지에 기여한 사람들에게 상을 주도록 유언을 남겼습니다.¶노르웨이 시상 이유: 노벨 사망 당시 스웨덴과 노르웨이는 한 국가(병합 상태)였으며, 노벨이 유언장에서 평화상 시상권만 노르웨이 노벨위원회에 위임했기 때문입니다.|
(서술형) 노벨상 메달, 상장, 상금의 관리 및 구성 특성(메달 재질, 상금 출처, 세금 혜택 등)을 설명하시오.|메달: 18K 순금으로 제작되며, 전면에는 노벨의 초상이, 뒷면에는 각 분야별 예술적 디자인이 새겨집니다.¶상장: 스웨덴과 노르웨이 저명 예술가가 수작업으로 제작한 독특한 예술품입니다.¶상금 및 세금: 노벨 재단의 기금 투자 수익금으로 지급(2024년 기준 1,100만 크로나)되며, 대한민국 법률상 비과세 소득으로 인정받아 세금이 부과되지 않습니다.|`
];
const names=['공룡과 한반도 화석','남극 과학기지와 극지 연구','태양과 우주 날씨','엘리뇨와 라니냐','일상 속 화학물질 안전','오펜하이머와 페이퍼클립','나폴레옹과 역사·과학','옥스퍼드와 로스앨러모스','코펜하겐과 알렉산드리아','스톡홀름과 노벨상'];
function parse(block,count,fields){const result=block.trim().split('\n').map(line=>line.split('|'));if(result.length!==count||result.some(row=>row.length!==fields))throw Error('문항 데이터 형식 오류');return result}
const topics=names.map((name,i)=>({name,mc:parse(mcBlocks[i],25,7).map(([question,...rest])=>({question,options:rest.slice(0,4),answer:rest[4],explanation:rest[5]})),written:parse(writtenBlocks[i],5,3).map(([question,answer,point])=>({question,answer:answer.replaceAll('¶','\n'),point}))}));
const state={topic:0,mode:'mc',index:0,selected:null,revealed:false};
const $=id=>document.getElementById(id),numbers=['①','②','③','④'];
const titles=['feedback-correct','feedback-incorrect','feedback-written','feedback-pick','feedback-type'];
const topicList=$('topic-list'),options=$('options');
topics.forEach((topic,i)=>{const button=document.createElement('button');button.type='button';button.className='topic-button';button.textContent=`${String(i+1).padStart(2,'0')}  ${topic.name}`;button.addEventListener('click',()=>{if(state.topic===i)return;state.topic=i;state.index=0;reset()});topicList.append(button)});
const optionButtons=numbers.map((number,i)=>{const button=document.createElement('button'),digit=document.createElement('span'),label=document.createElement('span');button.type='button';button.className='option';digit.className='option-number';digit.textContent=number;button.append(digit,label);button.addEventListener('click',()=>{if(state.revealed)return;state.selected=i;updateOptions();hideFeedback()});options.append(button);return{button,label}});
function hideFeedback(){$('feedback').hidden=true;$('feedback').classList.remove('wrong');titles.forEach(id=>$(id).hidden=true);$('feedback-body').textContent=''}
function showFeedback(id,body='',wrong=false){titles.forEach(key=>$(key).hidden=key!==id);$('feedback-body').textContent=body;$('feedback').classList.toggle('wrong',wrong);$('feedback').hidden=false}
function reset(){state.selected=null;state.revealed=false;$('written-answer').value='';hideFeedback();render()}
function updateOptions(){const item=topics[state.topic].mc[state.index];optionButtons.forEach(({button,label},i)=>{label.textContent=item.options[i];button.classList.toggle('selected',state.selected===i);button.classList.toggle('correct',state.revealed&&numbers[i]===item.answer);button.classList.toggle('incorrect',state.revealed&&state.selected===i&&numbers[i]!==item.answer);button.setAttribute('aria-pressed',String(state.selected===i));button.disabled=state.revealed})}
function render(){const topic=topics[state.topic],items=topic[state.mode],item=items[state.index];[...topicList.children].forEach((button,i)=>{button.classList.toggle('active',i===state.topic);if(i===state.topic)button.setAttribute('aria-current','true');else button.removeAttribute('aria-current')});$('topic-kicker').textContent=`주제 ${String(state.topic+1).padStart(2,'0')} / ${topic.name}`;$('counter').textContent=`${state.mode==='mc'?'객관식':'주관식'} · ${state.index+1} / ${items.length}`;$('question').textContent=`Q${state.index+1}. ${item.question}`;const percent=Math.round((state.index+1)/items.length*100);$('progress-fill').style.width=percent+'%';$('progress-track').setAttribute('aria-valuenow',String(percent));['mc','written'].forEach(mode=>{const button=$(`${mode}-mode`),active=mode===state.mode;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))});options.hidden=state.mode!=='mc';$('written-area').hidden=state.mode!=='written';if(state.mode==='mc')updateOptions();$('written-answer').disabled=state.revealed;$('submit').disabled=state.revealed;$('previous').disabled=state.index===0;$('next').disabled=state.index===items.length-1}
$('mc-mode').addEventListener('click',()=>{if(state.mode==='mc')return;state.mode='mc';state.index=0;reset()});
$('written-mode').addEventListener('click',()=>{if(state.mode==='written')return;state.mode='written';state.index=0;reset()});
$('previous').addEventListener('click',()=>{if(state.index>0){state.index--;reset()}});
$('next').addEventListener('click',()=>{if(state.index<topics[state.topic][state.mode].length-1){state.index++;reset()}});
$('submit').addEventListener('click',()=>{const item=topics[state.topic][state.mode][state.index];if(state.mode==='mc'&&state.selected===null){showFeedback('feedback-pick','',true);optionButtons[0].button.focus();return}if(state.mode==='written'&&!$('written-answer').value.trim()){showFeedback('feedback-type','',true);$('written-answer').focus();return}state.revealed=true;render();if(state.mode==='written'){showFeedback('feedback-written',`정답 및 모범 답안:\n${item.answer}${item.point?`\n핵심 포인트: ${item.point}`:''}`)}else{const correct=numbers[state.selected]===item.answer;showFeedback(correct?'feedback-correct':'feedback-incorrect',`정답: ${item.answer}\n해설: ${item.explanation}`,!correct)}});
render();
</script>
