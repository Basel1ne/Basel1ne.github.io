[서술형] 메모리 반도체와 시스템 반도체의 기능과 생산 방식을 비교하시오.|메모리 반도체는 정보를 저장하고 IDM 중심의 소품종 대량 생산을 한다. 시스템 반도체는 논리·연산·제어를 담당하고 팹리스와 파운드리의 분업을 통한 다품종 소량 생산이 특징이다.|저장과 처리 기능, 생산 체계의 차이를 함께 설명합니다. [2, 3]
[서술형] 포토 공정과 식각 공정의 역할을 비교하시오.|포토 공정은 감광액을 도포한 웨이퍼에 빛으로 회로 패턴을 형성한다. 식각 공정은 그 패턴의 불필요한 부분을 액체나 기체의 화학 반응으로 제거한다.|패턴 형성과 불필요한 부분 제거의 차이입니다. [4]`,
`[단답형] mRNA를 감싸 보호·전달하는 지질 전달체의 약자는?|LNP(지질 나노입자)|mRNA를 분해로부터 보호하고 세포 전달을 돕습니다. [13]
[단답형] 검체를 미세 방울로 나눠 절대 정량하는 PCR은?|디지털 PCR(Digital PCR)|개별 방울의 반응을 판별합니다. [14, 15]
[단답형] 균일한 퀀텀닷 입자를 합성하는 현택환 교수팀 기술은?|승원법(Heat-up process)|온도를 서서히 높여 입자를 균일하게 성장시킵니다. [21]
[서술형] 실시간 PCR과 디지털 PCR의 정량 방식을 비교하시오.|실시간 PCR은 형광 신호를 표준 곡선과 비교하는 상대 정량 방식이다. 디지털 PCR은 검체를 다수의 미세 방울로 나누고 개별 반응을 판별하는 절대 정량 방식으로 저농도 검출에 유리하다.|상대 정량과 절대 정량의 차이를 설명합니다. [15]
[서술형] QLED 제작에서 나노 입자 크기의 균일성이 중요한 이유는?|나노 입자의 크기가 발광 색상을 결정하므로, 입자의 크기를 균일하게 제어해야 일정하고 선명한 색을 표현할 수 있다.|입자 크기와 발광 색상의 관계가 핵심입니다. [21]`,
`[단답형] 인공 설계로 자연계에 없는 특성을 구현하는 구조 물질은?|메타물질(Metamaterial)|인위적인 구조 설계로 특이한 물성을 구현합니다. [28]
[단답형] 벌집 모양 2차원 탄소 신소재는?|그래핀(Graphene)|탄소 원자 한 층으로 이루어진 2차원 물질입니다. [33]
[단답형] 가전자대와 전도대 사이의 에너지 차이는?|밴드 갭(Band gap)|전자의 전도대 이동과 관련된 에너지 차이입니다. [38]
[서술형] 그래핀의 반도체 스위칭 소자 활용이 어려운 이유는?|그래핀은 밴드 갭이 거의 없어 전류가 흐르는 상태를 완전히 차단하기 어렵다. 디지털 스위칭에는 전류를 켜고 끌 수 있는 제어가 필요하므로 밴드 갭을 형성하는 기술이 요구된다.|밴드 갭의 부재와 전류 차단의 어려움을 연결합니다. [33, 37, 38]
[서술형] 리튬 과잉 양극 소재의 단점과 새 하이니켈 소재의 성과는?|기존 소재는 에너지 밀도가 높지만 반복 충방전 때 전압이 떨어졌다. 자료의 새 하이니켈 리튬 과잉 양극 소재는 40회 충방전 후 전압 강하를 0.05V 이내로 낮춰 전압 안정성을 개선했다.|기존 전압 강하 문제와 개선 수치를 함께 설명합니다. [30, 31]`,
`[단답형] 두 줄이 꼬여 길이가 짧아지는 원리의 구동기 약자는?|TSA(Twisted String Actuator, 줄꼬임 구동기)|줄꼬임으로 인장력을 전달합니다. [43]
[단답형] 근육 수축·운동 때 발생하는 전기 신호는?|근전도(EMG)|착용자의 동작 의도를 파악하는 데 활용합니다. [46]
[단답형] 락히드마틴의 보병용 외골격 시스템은?|HULC(Human Universal Load Carrier)|군인의 장비 운반을 보조하는 외골격입니다. [48]
[서술형] 산업 현장에서 웨어러블 로봇이 필요한 이유를 설명하시오.|건설·물류 등의 현장은 비정형적이고 사람의 섬세한 작업이 필요해 완전 자동화가 어렵다. 웨어러블 로봇은 이런 현장에서 사람의 움직임을 보조해 신체 부담과 부상 위험을 줄인다.|현장의 비정형성과 인간 능력 보완을 연결합니다. [39, 42, 45]
[서술형] 손목 센서 하나로 악력 로봇 장갑을 안전하게 제어하는 원리는?|손목의 단일 근전도 센서로 강한 악력을 발휘할 때의 신호 패턴을 찾고 일상 동작의 신호와 구별한다. 이에 따라 필요할 때만 장갑이 힘을 보태 의도하지 않은 쥐기 동작을 줄인다.|신호 구별과 오작동 방지가 핵심입니다. [46, 47]`,
`[단답형] 적외선 빛을 열로 바꿔 인공근육 수축을 돕는 소재는?|그래핀(Graphene)|그래핀의 광열 변환이 액정의 움직임을 유도합니다. [50, 51]
[단답형] 달팽이관 전극으로 청신경을 자극하는 장치는?|인공와우(Cochlear Implant)|내이 손상이 심한 사람의 청각을 돕습니다. [54]
[단답형] 가상 환경의 촉감을 전달하는 감각 피드백 기술은?|햅틱(Haptic)|힘과 질감 정보를 사용자에게 전달합니다. [57, 58]
[서술형] 보청기와 인공와우의 작동 원리 및 대상의 차이는?|보청기는 외부 소리를 증폭해 내이 기능이 남아 있는 난청 환자에게 전달한다. 인공와우는 내이 손상이 심해 증폭만으로 듣기 어려운 경우 소리를 전기 신호로 바꿔 청신경을 직접 자극한다.|소리 증폭과 청신경 직접 자극을 비교합니다. [54]
[서술형] 적외선에 반응하는 인공근육의 원리와 자료상 성과는?|인공근육의 그래핀이 적외선을 열로 바꾸면 반응성 액정 구조가 변하며 수축하고, 자극이 사라지면 이완한다. 자료에서는 실제 자벌레보다 3배 빠른 인공 자벌레와 인간 근육보다 17배 높은 작업 수행 능력을 소개한다.|광열 변환 원리와 두 비교 수치를 설명합니다. [51, 52]`,
`[단답형] 실제 도로를 가상 공간에 복제해 주행을 시험하는 기술은?|디지털 트윈(Digital Twin)|현실의 구조와 상황을 가상으로 구현합니다. [66, 67]
[단답형] 지정된 영역 안에서 운전자 개입 없이 주행하는 단계는?|레벨 4(Level 4)|정해진 운행 조건에서 시스템이 주행을 수행합니다. [64]
[단답형] 항로와 연료 사용을 관리하는 비행 시스템의 약자는?|FMS(Flight Management System)|비행 경로와 연료 계획을 지원합니다. [72]
[서술형] 자율주행 개발에 디지털 트윈을 사용하는 이유는?|실제 도로에서 무단횡단·갑작스러운 끼어들기·악천후 같은 위험한 상황을 반복 시험하면 사고 위험과 비용이 크다. 디지털 트윈에서는 다양한 예외 상황을 안전하고 효율적으로 재현해 알고리즘을 검증할 수 있다.|실도로 시험의 한계와 가상 시험의 이점을 설명합니다. [66, 67]
[서술형] 자율주행에서 데이터 주권이 중요한 이유는?|차량 이동 데이터와 고정밀 지도는 국가 인프라·안보와 관련된 핵심 정보다. 해외 기업에 통제권이 집중되면 데이터 접근과 산업 자립성이 약해질 수 있어 적절한 보호·관리 체계가 필요하다.|이동·지도 정보의 산업적·안보적 가치를 설명합니다. [69, 70]`,
`[단답형] 재생에너지 전력으로 물을 분해해 만든 수소는?|그린 수소(Green Hydrogen)|재생에너지 기반 수전해로 생산합니다. [76, 77]
[단답형] 수소를 질소와 결합해 운송할 때 쓰는 화합물은?|암모니아(NH₃)|암모니아에서 다시 수소를 추출할 수 있습니다. [79, 80]
[단답형] 유기 액체에 수소를 저장해 운송하는 기술의 약자는?|LOHC(Liquid Organic Hydrogen Carrier)|상온·상압에서 액체 인프라를 활용할 수 있습니다. [81, 82]
[서술형] 그레이·블루·그린 수소를 생산과 탄소 배출 측면에서 비교하시오.|그레이 수소는 화석연료 개질 등으로 생산하며 이산화탄소가 배출된다. 블루 수소는 그 과정에 탄소 포집·저장을 결합해 배출량을 줄인다. 그린 수소는 재생에너지 전력을 이용한 물의 전기분해로 생산한다.|화석연료·탄소 포집·재생에너지 수전해를 구별합니다. [77]
[서술형] 탄소중립의 개념과 달성 방안 두 가지를 설명하시오.|탄소중립은 온실가스 배출량과 흡수·제거량의 균형을 맞춰 순배출량을 0으로 만드는 것이다. 재생에너지 전환으로 배출을 줄이고 조림이나 탄소 포집·저장으로 탄소를 흡수·제거할 수 있다.|배출 감축과 흡수·제거 방안을 함께 제시합니다. [84, 85]`,
`[단답형] 석탄 대신 수소로 철광석을 환원하는 기술은?|수소환원제철|수소와 철광석의 산소가 결합해 물을 만듭니다. [87, 88]
[단답형] 부생수소·수소 배관망·수소 선박 실증으로 소개된 도시는?|울산(울산광역시)|자료의 대표적인 수소시범도시입니다. [90]
[단답형] 공기 중 수소의 대략적인 폭발 가능 농도 범위는?|약 4~75%|점화원과 산소가 있는 조건에서 위험합니다. [95, 96]
[서술형] 기존 고로 제철과 수소환원제철의 환원제·생성물을 비교하시오.|기존 고로는 코크스에서 얻은 일산화탄소로 철광석을 환원하며 이산화탄소가 발생한다. 수소환원제철은 수소를 환원제로 사용하고 산소와 결합한 물이 생성된다.|일산화탄소·이산화탄소와 수소·물의 차이입니다. [88]
[서술형] 수소 폭발의 조건과 순수 수소만으로는 폭발하지 않는 이유는?|수소가 공기와 섞여 폭발 가능 농도 범위에 있고 산소와 점화원이 있어야 연소·폭발이 일어날 수 있다. 산소가 없는 순수 수소만 존재한다면 산화 반응을 일으킬 산소가 없어 폭발하지 않는다.|농도·점화원·산소의 세 조건을 설명합니다. [95, 96]`,
`[단답형] 분말을 레이저로 소결하는 3D 프린팅 방식의 약자는?|SLS(Selective Laser Sintering)|주변 미소결 분말이 출력물을 지지합니다. [101, 102]
[단답형] 레이저로 금속 분말을 증착해 비구컵을 코팅하는 방식은?|DED(Direct Energy Deposition)|다공성 금속 표면을 형성하는 데 쓰입니다. [104, 105]
[단답형] 체온 부근에서 스스로 젤화되는 바이오잉크는?|온도감응성 하이드로젤(온도감응성 바이오잉크)|자외선 없이 체온에서 굳는 소재입니다. [106, 107]
[서술형] 인공관절 비구컵 표면에 미세 구멍을 만드는 이유는?|표면의 미세 구멍으로 환자의 뼈 조직이 자라 들어오면 인공관절과 뼈가 더 견고하게 결합할 수 있다. 이는 초기 고정력과 장기적 안정성을 높이는 데 도움을 준다.|뼈의 성장·침투와 결합력 향상을 설명합니다. [104, 105]
[서술형] 광경화 바이오잉크와 온도감응성 바이오잉크를 비교하시오.|자외선 광경화 방식은 조사 과정에서 세포 손상 등의 우려가 있다. 온도감응성 바이오잉크는 낮은 온도에서 출력하기 쉬운 액체 상태이고 체온 약 37℃에서 젤화해 자외선 조사 없이 조직 지지체를 형성한다.|자외선 노출 문제와 체온 젤화 원리를 비교합니다. [106, 107]`,
`[단답형] 0과 1의 양자 상태를 이용하는 기본 정보 단위는?|큐비트(Qubit)|양자 중첩을 활용하는 정보 단위입니다. [109]
[단답형] 극미세 자기장을 측정하는 초전도 양자 간섭 센서는?|SQUID(스퀴드)|뇌자도 등에서 미세 자기장을 측정합니다. [114]
[단답형] 떨어진 입자들의 측정 결과에 강한 상관관계가 나타나는 현상은?|양자 얽힘(Quantum Entanglement)|얽힘만으로 초광속 메시지를 보낼 수는 없습니다. [117, 118]
[서술형] 양자 중첩과 측정 때의 변화를 설명하시오.|양자 중첩은 측정 전에 여러 가능한 상태가 함께 표현되는 현상이다. 측정하면 정해진 확률에 따라 하나의 결과가 관측되며, 이를 파동함수 붕괴로 설명한다.|중첩 상태와 관측 결과의 관계를 설명합니다. [115, 116]
[서술형] 양자 키 분배가 도청 시도를 감지하는 원리 두 가지는?|알 수 없는 양자 상태는 완벽히 복제할 수 없다는 양자 복제 불가 원리가 있다. 또한 광자를 측정하면 상태가 교란될 수 있어 송신자와 수신자는 통계적 오류를 검사하여 도청 가능성을 탐지하고 문제가 있는 키를 폐기할 수 있다.|복제 불가와 측정에 따른 교란을 함께 설명합니다. [111]`
];
function parse(block,count,fields){
  const rows=block.trim().split('\n').map(line=>line.split('|'));
  if(rows.length!==count||rows.some(row=>row.length!==fields))throw new Error('문항 데이터 형식 오류');
  return rows;
}
const topics=names.map((name,i)=>({
  name,
  mc:parse(mcBlocks[i],25,7).map(([question,a,b,c,d,answer,explanation])=>({question,options:[a,b,c,d],answer:Number(answer)-1,explanation})),
  written:parse(writtenBlocks[i],5,3).map(([question,answer,explanation])=>({question,answer,explanation}))
}));
const state={topic:0,mode:'mc',index:0,selected:null,revealed:false};
const $=id=>document.getElementById(id);
const numbers=['①','②','③','④'];
const feedbackTitles=['feedback-correct','feedback-incorrect','feedback-written','feedback-pick','feedback-type'];
const topicList=$('topic-list'),options=$('options');
topics.forEach((topic,i)=>{
  const button=document.createElement('button');
  button.type='button';button.className='topic-button';
  button.textContent=`${String(i+1).padStart(2,'0')}  ${topic.name}`;
  button.addEventListener('click',()=>{if(state.topic===i)return;state.topic=i;state.index=0;reset()});
  topicList.append(button);
});
const optionButtons=numbers.map((number,i)=>{
  const button=document.createElement('button'),digit=document.createElement('span'),label=document.createElement('span');
  button.type='button';button.className='option';digit.className='option-number';digit.textContent=number;
  button.append(digit,label);
  button.addEventListener('click',()=>{if(state.revealed)return;state.selected=i;updateOptions();hideFeedback()});
  options.append(button);return{button,label};
});
function hideFeedback(){
  $('feedback').hidden=true;$('feedback').classList.remove('wrong');
  feedbackTitles.forEach(id=>$(id).hidden=true);
  $('feedback-body').textContent='';
}
function showFeedback(id,body='',wrong=false){
  feedbackTitles.forEach(key=>$(key).hidden=key!==id);
  $('feedback-body').textContent=body;
  $('feedback').classList.toggle('wrong',wrong);
  $('feedback').hidden=false;
}
function reset(){
  state.selected=null;state.revealed=false;
  $('written-answer').value='';hideFeedback();render();
}
function updateOptions(){
  const item=topics[state.topic].mc[state.index];
  optionButtons.forEach(({button,label},i)=>{
    label.textContent=item.options[i];
    button.classList.toggle('selected',state.selected===i);
    button.classList.toggle('correct',state.revealed&&i===item.answer);
    button.classList.toggle('incorrect',state.revealed&&state.selected===i&&i!==item.answer);
    button.setAttribute('aria-pressed',String(state.selected===i));
    button.disabled=state.revealed;
  });
}
function render(){
  const topic=topics[state.topic],items=topic[state.mode],item=items[state.index];
  [...topicList.children].forEach((button,i)=>{
    button.classList.toggle('active',i===state.topic);
    if(i===state.topic)button.setAttribute('aria-current','true');
    else button.removeAttribute('aria-current');
  });
  $('topic-kicker').textContent=`주제 ${String(state.topic+1).padStart(2,'0')} / ${topic.name}`;
  $('counter').textContent=`${state.mode==='mc'?'객관식':'주관식'} · ${state.index+1} / ${items.length}`;
  $('question').textContent=`Q${state.index+1}. ${item.question}`;
  const percent=Math.round((state.index+1)/items.length*100);
  $('progress-fill').style.width=percent+'%';
  $('progress-track').setAttribute('aria-valuenow',String(percent));
  ['mc','written'].forEach(mode=>{
    const button=$(`${mode}-mode`),active=mode===state.mode;
    button.classList.toggle('active',active);
    button.setAttribute('aria-pressed',String(active));
  });
  options.hidden=state.mode!=='mc';
  $('written-area').hidden=state.mode!=='written';
  if(state.mode==='mc')updateOptions();
  $('written-answer').disabled=state.revealed;
  $('submit').disabled=state.revealed;
  $('previous').disabled=state.index===0;
  $('next').disabled=state.index===items.length-1;
}
$('mc-mode').addEventListener('click',()=>{if(state.mode==='mc')return;state.mode='mc';state.index=0;reset()});
$('written-mode').addEventListener('click',()=>{if(state.mode==='written')return;state.mode='written';state.index=0;reset()});
$('previous').addEventListener('click',()=>{if(state.index>0){state.index--;reset()}});
$('next').addEventListener('click',()=>{if(state.index<topics[state.topic][state.mode].length-1){state.index++;reset()}});
$('submit').addEventListener('click',()=>{
  const item=topics[state.topic][state.mode][state.index];
  if(state.mode==='mc'&&state.selected===null){
    showFeedback('feedback-pick','',true);optionButtons[0].button.focus();return;
  }
  if(state.mode==='written'&&!$('written-answer').value.trim()){
    showFeedback('feedback-type','',true);$('written-answer').focus();return;
  }
  state.revealed=true;render();
  if(state.mode==='written'){
    showFeedback('feedback-written',`정답 및 모범 답안: ${item.answer}\n해설: ${item.explanation}`);
  }else{
    const correct=state.selected===item.answer;
    showFeedback(correct?'feedback-correct':'feedback-incorrect',
      `정답: ${numbers[item.answer]} ${item.options[item.answer]}\n해설: ${item.explanation}`,!correct);
  }
});
render();
</script>
