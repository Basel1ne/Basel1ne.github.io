`백제 시대 궁중음악인 '수제천'에 대한 설명으로 옳은 것은?|원래부터 가사가 없는 관악합주곡으로 창작되었다.|하늘처럼 영원한 생명이 깃들기를 기원하는 의미를 지닌다.|조선 시대에 새로 가사가 추가되어 가창곡으로 발전하였다.|오직 피리와 대금 두 가지 악기로만 연주하는 단조로운 구성이다.|2|수제천은 하늘처럼 영원한 생명이 깃들기를 기원하는 의미를 가집니다. 원래 가사가 있었으나 고려와 조선을 거치며 가사가 빠지고 현재는 관악합주로 연주됩니다.
국악기 연주에서 음정을 휘어지게 만들어 떨거나 흘려 내리는 기법을 뜻하는 용어는?|요성|와류|공진|3분손익|1|국악에서는 음정을 휘어지게 만들어 음정의 편차를 이용해 떨거나 흘려 내리는 기법을 '요성'이라고 합니다.
편종의 구조 및 특징에 대한 설명으로 옳지 않은 것은?|두 단의 나무틀에 총 16개의 종을 매달아 연주한다.|구리로 만든 같은 크기의 종들이 사용된다.|고유한 음정을 내는 유율 타악기에 속한다.|종의 크기와 지름을 서로 다르게 제작하여 음의 높낮이를 조절한다.|4|편종은 16개의 구리로 만든 '같은 크기'의 종을 사용하며, 종의 크기가 아닌 '두께'에 따라 음의 높낮이가 달라집니다.
편종에서 종의 두께와 음의 높낮이 간의 관계 및 원리로 옳은 것은?|두께가 두꺼울수록 진동수가 느려져 낮은음이 난다.|두께가 두꺼울수록 진동수가 많아져 높은음이 난다.|두께가 얇을수록 진동수가 많아져 높은음이 난다.|종의 두께와 진동수는 무관하며 때리는 위치에 따라 결정된다.|2|편종은 종의 두께가 두꺼우면 진동수가 많아져 높은음이 되고, 두께가 얇으면 진동수가 느려져 낮은음이 됩니다.
장구의 왼쪽 면인 '궁편' 소가죽에 화학 처리를 하는 주요 목적은?|가죽을 단단하게 만들어 더 높은음을 내기 위해|가죽을 부드럽게 팽창시켜 낮은음을 내기 위해|가죽의 습기 흡수를 막아 음색 변화를 없애기 위해|오른쪽 체편과의 음색 차이를 없애 동일한 음을 내기 위해|2|장구 궁편의 소가죽을 화학 처리해 부드럽게 만들면 부드러운 가죽이 팽창되면서 낮은음을 내게 됩니다.
장구 가운데에 위치한 '조이개'를 오른쪽 면인 체편 쪽으로 옮겼을 때 나타나는 현상은?|가죽이 팽창하여 더 낮은음이 난다.|가죽이 수축하여 더 높은음을 낼 수 있게 된다.|진동수가 감소하여 울림이 길어진다.|음색이 무율에서 유율 타악기로 변한다.|2|장구 조이개를 체편 쪽으로 옮기면 가죽이 수축되면서 더 높은음을 낼 수 있게 됩니다.
가야금의 구조와 특징에 대한 설명으로 옳지 않은 것은?|삼국 시대 초에 등장한 전통 현악기이다.|널찍한 공명통 위에 12개의 줄받침(안족)을 올린다.|명주실을 꼬아 만든 12개의 줄을 사용한다.|연주자의 몸에서 멀어질수록 줄이 가늘어져 높은 소리가 난다.|4|가야금은 연주자의 몸쪽 줄이 가늘어 높은 소리가 나고, 연주자 몸에서 멀어질수록 줄이 굵어져 낮은 소리가 납니다.
가야금 연주 시 발생하는 소리의 합성 요소에 해당하지 않는 것은?|현의 진동에 의해 발생된 소리|앞판의 진동에 의해 발생된 소리|뒤판의 진동 및 내부 공명으로 방사된 소리|취구의 경사면을 통과하며 발생하는 와류 소리|4|가야금 소리는 현의 진동, 앞판 진동, 뒤판 진동 및 내부 공명 소리가 합쳐진 것입니다. 취구의 와류 소리는 관악기인 단소의 발음 원리입니다.

`액체를 구성하는 분자 입자의 종류와 무관하게 모든 액체의 흐름을 범용적으로 설명하며, 배나 잠수함 및 파이프 설계에 활용되는 수학적 방정식의 명칭을 쓰시오.|나비에-스토크스 방정식 (Navier-Stokes Equations)|액체 분자 구조의 불확실성을 극복하고 모든 액체 흐름을 설명하는 보편적 유체역학 방정식입니다.
딥러닝의 복잡한 함수 최적화 과정에서 알고리즘이 지역 최솟값(함정)에 빠지는 것을 방지하기 위해, 낮은 확률로 위로 거슬러 올라갈 수 있는 가능성을 주입하여 최댓/최솟점을 찾아내는 최적화 기법의 명칭을 쓰시오.|확률적 최적화 기법 (Stochastic Optimization)|알고리즘에 불확실성(확률)을 주입하여 함정을 빠져나오게 만드는 딥러닝의 핵심 최적화 원리입니다.
몬티홀 수수께끼에서 문 3개 중 1번을 선택한 후, 진행자가 염소가 있는 3번 문을 열어 보여준 상황에서 참가자가 선택을 바꾸었을 때 자동차를 얻게 될 최종 수학적 확률값을 쓰시오.|2/3 (또는 약 66.7%)|처음 문에 차가 있을 확률 1/3을 제외한 나머지 2/3의 확률이 남은 문으로 집중되므로 선택을 바꾸는 것이 유리합니다.
동전이나 주사위를 던질 때, 운동 방정식에 의해 물리적으로 결과가 이미 결정되어 있음에도 불구하고 인간이 이를 '불확실하다'고 느끼는 이유 2가지를 서술하시오.|1) 던졌을 때 나올 수 있는 가능성(앞/뒷면, 1~6 눈금)이 여러 가지 존재하기 때문이다.2) 던지는 순간 주어진 힘과 방향을 바탕으로 실제 결과를 계산하여 알아내는 것이 극도로 어렵기 때문이다.|
딥러닝 최적화 문제에서 결정론적 알고리즘이 계곡(지역 최솟값 함정)에 빠지는 원리와, 이를 확률적 불확실성을 주입하여 극복하는 원리를 서술하시오.|1) 함정 발생 원리: 컴퓨터는 현재 위치 주변을 둘러보고 함수값이 작아지는 방향으로만 이동하므로, 전체 최솟값이 아닌 중간의 깊은 계곡(지역 최솟값)에 도달하면 더 이상 벗어나지 못합니다.2) 확률 주입 극복 원리: 높은 확률로는 작아지는 방향으로 이동하되, 낮은 확률로 위로 올라갈 수 있는 불확실성을 부여함으로써 시간을 주면 계곡 함정을 빠져나와 전체 최솟값으로 이동하게 됩니다.|`,
`배우 전체 혹은 신체 일부를 실제처럼 본떠 제작하며, 수술 장면이나 재난 영화 등에서 위험하거나 불가능한 연기를 대체하기 위해 사용되는 실물 크기 모형의 명칭을 쓰시오.|더미 (Dummy)|인체 해부학 지식을 바탕으로 라이프캐스팅하여 실제 사람과 똑같이 제작하는 모형입니다.
더미 모형에 기계 제어 장치를 결합하여 눈을 깜빡이거나 입을 벌리는 등 섬세하고 리얼한 움직임을 동작하게 만드는 기술의 명칭을 쓰시오.|애니메트로닉스 (Animatronics)|애니메이션과 일렉트로닉스를 결합하여 로봇처럼 움직이는 더미를 구현하는 기술입니다.
여러 대의 카메라로 인체를 다각도에서 동시에 촬영하여 3D 디지털 형태를 구축하는 스캔 기술의 명칭을 쓰시오.|포토그램에트리 (Photogrammetry)|고해상도 3D 인체 스캔을 통해 배우의 디지털 더블을 제작하는 기법입니다.
기존 그린 스튜디오(크로마키) 촬영 방식과 비교하여, LED 스크린을 활용한 '버추얼 프로덕션(인카메라 VFX)' 시스템이 가지는 혁신적 장점 2가지를 서술하시오.|1) 버추얼 프로덕션은 LED 스크린 상에서 촬영과 합성이 한 번에 이루어지므로 후반 작업 시간을 단축하고 제작 비용을 절감합니다.2) 배우와 스태프가 촬영 현장에서 최종 완성 이미지를 눈으로 직접 보면서 연기하고 연출할 수 있어 작업 효율성이 극대화됩니다.|
영화 제작에서 '디지털 더블(Digital Double)'의 개념과, 위험한 액션 신 촬영 시 이를 활용하는 이유 및 이점을 서술하시오.|1) 개념: 포토그램에트리 스캔 장비 등을 이용해 배우의 외형과 움직임을 3D 그래픽으로 완벽히 재현한 가상 디지털 배우입니다.2) 활용 이유 및 이점: 절벽 추락, 헬기 폭발 등 대역 배우조차 수행하기 힘든 위험한 액션 신을 실제 인명 피해 없이 안전하고 사실감 넘치게 연출할 수 있습니다.|`,
`유전자마다 가지고 있는 짧은 단위 염기서열의 반복 횟수가 사람마다 다르다는 점을 이용하는 가장 보편적인 표준 DNA 개인 식별 분석 기술의 명칭(약어)을 쓰시오.|STR (Short Tandem Repeat) 분석법|짧은 반복 단위의 횟수 차이를 비교하여 범인을 특정하거나 친자 관계를 입증하는 표준 기술입니다.
사건 현장에서 보이지 않는 잠재 지문을 가시화하기 위해, 미세한 가루를 묻힌 고운 붓으로 물체 표면을 문질러 지문을 현출하는 가장 흔한 물리적 감식 기법의 명칭을 쓰시오.|분말법|가장 보편적으로 사용되는 물리적 지문 현출 기법입니다.
사람의 지문 패턴을 형태로 분류할 때 사용되는 3가지 주요 기본 유형의 명칭을 쓰시오.|루프 (Loop), 월 (Whorl), 아치 (Arch)|지문 융선의 흐름 형태에 따라 루프, 월, 아치의 3가지 기본 유형으로 분류합니다.
STR DNA 분석 실험 시, 추출된 샘플 DNA의 양을 정밀하게 측정하여 적절한 양으로 맞추어야 하는 이유를 DNA 양이 많을 때와 적을 때로 나누어 서술하시오.|1) DNA 양이 너무 많은 경우: 과도한 형광 신호가 발생하여 데이터 프로필을 해석하는 데 큰 어려움을 줍니다.2) DNA 양이 너무 적은 경우: 유전자 프로필이 완전하게 나오지 않아 신원 확인이 불가능해집니다.|
지문 인식 기술 중 '정전기식(용량식)'과 '초음파식'의 작동 원리 및 각각의 상대적 장단점을 비교하여 서술하시오.|1) 정전기식: 전극간 정전 용량 변화로 3D 패턴을 측정함. 3D 감지로 정밀도가 높고 몰드 위조에 안전하나, 손가락이 건조하거나 센서 오염 시 정확도가 떨어짐.2) 초음파식: 초음파 반사 신호로 고해상도 3D 이미지를 생성함. 습기/오염 손가락에서도 정확도가 매우 높고 디스플레이 하부 배치가 가능하나, 제조 비용이 가장 높음.|`,
`법과학에서 '모든 접촉은 흔적을 남긴다'는 명언을 남겨 미세증거물 수사의 이론적 기틀을 확립한 프랑스 박사의 이름을 쓰시오.|에드몽 로카르 (Edmond Locard)|'로카르의 법칙'으로 불리며 미세증거물 분석의 학문적 토대를 만든 인물입니다.
화학적 성분이 동일한 물질이라도 원료의 발생 지역이나 제조 환경에 따라 산소, 탄소 등의 원소 질량비가 다르게 존재하는 점을 이용해 범인을 특정하는 포렌식 기법의 명칭을 쓰시오.|동의원소 분석법 (Isotope Ratio Analysis)|청송 소주 사건, 쥐식빵 사건 등 동일 성분 물질의 출처와 동일성을 밝혀내는 기법입니다.
미국 연쇄살인범 BTK를 추적할 때, 범인이 보낸 플로피 디스크 파일 속에 기록되어 작성자 이름과 작성 컴퓨터 위치 단서를 제공한 디지털 데이터의 명칭을 쓰시오.|메타데이터 (Metadata)|파일 속 작성자 '데니스'와 캔자스주 위치타 교회의 컴퓨터 정보를 제공한 결정적 디지털 단서입니다.
영수증이나 입장권 등 감열지 표면에 남겨진 잠재 지문을 현출할 때, 일반 지문 시약을 사용할 수 없는 화학적 이유와 이를 해결하기 위한 방법을 서술하시오.|1) 일반 시약 사용 불가 이유: 감열지 속 무색 류코 염료가 일반 시약에 포함된 유기 용매와 반응하면 산화되어 검게 발색하여 지문 구별이 불가능해집니다.2) 해결 방법: 유기 용매 반응을 일으키지 않는 감열지 전용 지문 시약을 사용하여 유류 1시간 후 선명한 지문을 현출합니다.|
소변 내 '음주 대사체 감정 기법'이 기존의 혈중 알코올 농도 측정 방식에 비해 가지는 기술적 장점 2가지와 주요 활용 범죄 분야를 서술하시오.|1) 기술적 장점: 혈중 알코올은 8시간 내 소멸하지만, 음주 대사체는 소변에서 약 72시간 동안 길게 잔류하여 골든타임을 확보해 줍니다.2) 주요 활용 분야: 음주 뺑소니 사고 및 사건 발생 후 시간이 지나 술이 깬 성범죄 피해자의 당시 음주/항거불능 상태 입증에 활용됩니다.|`,
`해커가 감염된 다수의 좀비 PC를 원격 조종하여 목표 웹사이트에 대량의 트래픽을 한꺼번에 발생시켜 서버를 마비시키는 공격 기법의 명칭을 쓰시오.|디도스 공격 (DDoS : Distributed Denial of Service)|불특정 다수의 좀비 PC를 이용해 대량의 트래픽을 일으켜 서비스를 마비시키는 공격입니다.
과거 타 사이트들에서 유출되어 암시장에 돌아다니는 아이디와 비밀번호 데이터베이스(DB) 세트를 다른 주요 웹사이트 로그인 창에 무차별 대입하여 계정을 탈취하는 공격 기법을 쓰시오.|크리덴셜 스터핑 (Credential Stuffing)|동일한 계정 정보를 여러 사이트에 재사용하는 이용자의 습관을 노린 적은 노력 대비 높은 성공률의 해킹 수법입니다.
제2차 세계대전 당시 영국의 앨런 튜링과 암호학자들이 독일군의 전자기계식 암호기 '에니그마'를 해독하기 위해 특별히 개발한 전기 기계의 명칭을 쓰시오.|봄베 (Bombe)|앨런 튜링 팀이 에니그마의 천문학적 암호 조합을 신속히 해독하기 위해 창안한 전기 기계 장치입니다.

function reset(){state.selected=null;state.revealed=false;$('written-answer').value='';hideFeedback();render()}
function updateOptions(){const item=topics[state.topic].mc[state.index];optionButtons.forEach(({button,label},i)=>{label.textContent=item.options[i];button.classList.toggle('selected',state.selected===i);button.classList.toggle('correct',state.revealed&&i===item.answer);button.classList.toggle('incorrect',state.revealed&&state.selected===i&&i!==item.answer);button.setAttribute('aria-pressed',String(state.selected===i));button.disabled=state.revealed})}
function render(){const topic=topics[state.topic],items=topic[state.mode],item=items[state.index];[...topicList.children].forEach((button,i)=>{button.classList.toggle('active',i===state.topic);if(i===state.topic)button.setAttribute('aria-current','true');else button.removeAttribute('aria-current')});$('topic-kicker').textContent=`주제 ${String(state.topic+1).padStart(2,'0')} / ${topic.name}`;$('counter').textContent=`${state.mode==='mc'?'객관식':'주관식'} · ${state.index+1} / ${items.length}`;$('question').textContent=`Q${state.index+1}. ${item.question}`;const percent=Math.round((state.index+1)/items.length*100);$('progress-fill').style.width=percent+'%';$('progress-track').setAttribute('aria-valuenow',String(percent));['mc','written'].forEach(mode=>{const button=$(`${mode}-mode`),active=mode===state.mode;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))});options.hidden=state.mode!=='mc';$('written-area').hidden=state.mode!=='written';if(state.mode==='mc')updateOptions();$('written-answer').disabled=state.revealed;$('submit').disabled=state.revealed;$('previous').disabled=state.index===0;$('next').disabled=state.index===items.length-1}
$('mc-mode').addEventListener('click',()=>{if(state.mode==='mc')return;state.mode='mc';state.index=0;reset()});$('written-mode').addEventListener('click',()=>{if(state.mode==='written')return;state.mode='written';state.index=0;reset()});$('previous').addEventListener('click',()=>{if(state.index>0){state.index--;reset()}});$('next').addEventListener('click',()=>{if(state.index<topics[state.topic][state.mode].length-1){state.index++;reset()}});
$('submit').addEventListener('click',()=>{const item=topics[state.topic][state.mode][state.index];if(state.mode==='mc'&&state.selected===null){showFeedback('feedback-pick','',true);optionButtons[0].button.focus();return}if(state.mode==='written'&&!$('written-answer').value.trim()){showFeedback('feedback-type','',true);$('written-answer').focus();return}state.revealed=true;render();if(state.mode==='written'){showFeedback('feedback-written',`정답 및 모범 답안: ${item.answer}${item.point?`\n핵심 포인트: ${item.point}`:''}`)}else{const correct=state.selected===item.answer;showFeedback(correct?'feedback-correct':'feedback-incorrect',`정답: [${numbers[item.answer]}]해설: ${item.explanation}`,!correct)}});
render();
</script>
