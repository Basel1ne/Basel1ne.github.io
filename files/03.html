:root{--ink:#142f38;--muted:#59717a;--teal:#087c78;--line:#dce8e5;--paper:#f4f7f2}

.main-content{max-width:1180px;margin:auto;padding:30px 24px 64px;display:grid;grid-template-columns:275px minmax(0,1fr);gap:26px}

.option:hover:not(:disabled){border-color:#65bcb1;background:#f5fbf9}
.option.selected{border-color:var(--teal);background:#eaf7f3}
.option.correct{border-color:#178b67;background:#e8f6ed}
.option.incorrect{border-color:#c76c59;background:#fff0ed}
.option-number{color:#087c78;font-weight:800;flex:none}

</style>

우주 쓰레기의 발생 원인·위험·해결책을 설명하시오.|수명이 끝난 위성과 발사체 파편 등이 궤도에 남아 쓰레기가 된다. 높은 충돌 속도는 위성·우주정거장에 위험하며, 능동형 제거와 임무 후 폐기 및 국제적 관리 기준이 대응책이다.`,
`수직 농장의 개념과 장점 세 가지는?|빛·온도·습도 등을 제어하는 실내 재배 시설이다. 기상·병충해 영향 감소, 연중 생산, 수직 적층을 통한 공간 활용이 장점이다.
KPS 위성 구성·목표 연도·정밀도 목표는?|정지궤도 3기와 경사궤도 5기 등 총 8기를 계획했으며, 자료상 2035년 완성과 센티미터급 정밀 위치 서비스를 목표로 한다.
금산 위성 센터 개국 연도와 역사적 가치는?|1970년 개국한 한국 최초의 위성 지구국이다. 금산 1국 안테나는 2009년 4월 등록문화재로 지정되었다.
스타링크의 특성과 재난·전쟁 상황에서의 역할은?|저궤도 위성망은 지상 시설에 의존하기 어려운 곳에 통신을 제공한다. 우크라이나 전쟁 사례에서는 지상 통신망이 손상된 상황에서 행정·민간 연락과 현장 통신을 지원했다.
위성통신과 KPS가 국가 전략인 이유는?|통신과 정밀 위치·시각 정보는 재난 대응, 산업, 안보의 기반이다. 독자적 역량을 갖추면 해외 시스템에 대한 의존과 서비스 중단 위험을 줄일 수 있다.`,
`중심 이론의 유전 정보 흐름과 두 과정의 이름은?|DNA→RNA는 전사, RNA→단백질은 번역이다.
카리코·바이스만의 mRNA 관련 기술적 발견은?|mRNA의 뉴클레오사이드를 변형해 과도한 선천면역 반응을 줄이고 단백질 발현을 개선할 수 있음을 보였다.
국산 1호 코로나19 백신과 플랫폼은?|스카이코비원이며, 유전자 재조합 단백질 기반 백신이다.
고전적 백신과 비교한 mRNA 백신의 장점은?|기존 방식은 병원체의 배양·불활성화 또는 약독화 과정이 필요하다. mRNA 방식은 유전자 서열을 바탕으로 설계·합성할 수 있어 신속한 후보 개발과 변이 대응에 유리하다.
mRNA 전달에 LNP가 필요한 이유 두 가지는?|LNP는 분해 효소 등으로부터 불안정한 mRNA를 보호하고, 지질 성분을 이용해 세포 안으로 mRNA가 전달되도록 돕는다.`,
`디지털 치료기기의 정의와 국내 1호 사례는?|질병 예방·관리·치료 목적으로 인허가받은 소프트웨어 의료기기이다. 자료의 국내 1호 불면증 치료기기는 에임메드의 솜즈(Somzz)이다.
간세포 손상을 비교적 직접적으로 반영하는 검사 항목은?|ALT(알라닌 아미노트랜스퍼레이스, GPT)이다.
자료상 루닛 영상 AI의 정확도와 유방암 판독 보조 효과는?|자료에서는 흉부·유방 영상 AI의 검출 정확도를 약 96~99% 범위로 소개하고, 유방암을 놓칠 가능성을 낮추는 판독 보조 효과를 언급한다. 실제 성능은 평가 조건에 따라 다르다.
바이오 대전환의 개념과 사회적 영향은?|유전자·세포 등 바이오 기술과 ICT·AI가 결합하는 변화다. 정밀 의료, 질병 연구, 디지털 치료 등에서 새로운 서비스를 만들 수 있으나 효과와 안전성은 분야별 검증이 필요하다.
의료 AI가 있어도 최종 판단을 의료진이 해야 하는 이유는?|AI는 학습 데이터와 알고리즘의 한계를 갖는다. 환자의 병력·상황·선호도를 종합하고 진단 및 치료의 책임과 윤리적 판단을 수행하려면 의료진의 검토가 필요하다.`,
`CRISPR-Cas9의 두 구성 요소와 기능은?|가이드 RNA는 목표 DNA 서열을 찾아 안내하고, Cas9 단백질은 해당 위치의 DNA를 절단한다.
GMO와 유전자 가위 편집의 대표적 차이는?|자료에서 소개한 전통적 GMO는 외래 유전자 삽입에 초점을 두고, 유전자 편집은 기존 DNA 서열의 정밀한 변경에 초점을 둔다. 실제 기술과 규제 구분에는 예외가 있다.
고GABA 방울토마토의 편집 원리와 특징은?|GABA 대사에 관련된 유전자를 편집해 GABA 함량을 높인 토마토다. 자료에서는 일반 토마토보다 함량이 4~5배 높다고 소개한다.
지질 검사 네 항목과 심혈관 위험의 관계는?|총 콜레스테롤과 중성지방, LDL은 높은 수치가 위험 평가에 중요하다. HDL은 콜레스테롤 운반에 관여한다. 심혈관 위험은 개별 수치 하나가 아닌 전체 건강 상태와 함께 판단한다.
CRISPR-Cas9이 앞선 유전자 가위보다 유리한 점 세 가지는?|표적에 맞춰 가이드 RNA를 바꾸기 쉬워 설계가 비교적 간편하고, 제작 시간과 비용을 줄일 수 있으며, 다양한 생물의 유전자 연구에 활용할 수 있다. 정확도와 안전성 검증은 여전히 필요하다.`,
`허젠쿠이 배아 편집 사건의 표적·결과·처벌은?|CCR5 유전자를 편집해 쌍둥이 여아가 태어났고 국제적 윤리 파문을 일으켰다. 허젠쿠이는 불법 의료 행위 등으로 징역 3년형을 선고받았다.
프라임 에디팅과 일반적인 Cas9 이중 가닥 절단의 차이는?|프라임 에디팅은 DNA의 한 가닥을 절단하고 원하는 서열로 교정하는 방식을 사용해 이중 가닥 절단에 따른 일부 위험을 줄이는 것을 목표로 한다.
뇌 오가노이드란 무엇이며 연구상 장점은?|인간 줄기세포를 3차원으로 배양한 뇌 유사 조직이다. 인간 뇌 발달·질환의 일부 양상을 동물 모델과 보완적으로 연구하는 데 유용하다.
체세포 편집과 배아 편집의 유전·윤리적 차이는?|체세포 편집은 환자 개인에게 적용되며 일반적으로 후세대에 유전되지 않는다. 배아 편집은 변경 사항이 후세대에 전달될 수 있고 미래 당사자의 동의를 받을 수 없어 더 엄격한 윤리적 검토가 필요하다.
유전자 드라이브의 원리·활용·위험은?|특정 유전자가 통상적인 멘델 유전 확률보다 더 자주 후손에게 전달되도록 한다. 질병 매개 모기 제어 등에 연구될 수 있지만 자연계 확산 뒤 생태계 영향을 예측·통제하기 어렵다.`,
`K2와 K9의 주요 화력과 기술적 장점은?|K2는 120mm 활강포와 기동·사격 통제 기술을 갖춘 전차다. K9은 자료상 사거리 약 40km, 빠른 초탄 발사와 연속 사격이 가능한 자주포다.
워리어 플랫폼과 아미 타이거의 개념은?|워리어 플랫폼은 개인 피복·무기·조준 장비의 통합 체계다. 아미 타이거는 AI, 드론봇과 네트워크를 활용하는 미래형 육군 부대 개념이다.
연평도 포격전에서 자료가 소개한 K9의 대응은?|피격 상황에서 장갑으로 승무원을 보호하고, 자료상 약 13분 만에 반격 사격을 실시한 사례다.
한국군의 1950년 전력과 현재 방산 위상을 비교하시오.|6·25전쟁 초기 한국군은 전차와 전투기 등이 부족했다. 이후 K2·K9 등 국산 무기를 개발해 현대화했으며 여러 국가에 무기 체계를 수출하는 방산 산업을 성장시켰다.
드론·로봇·AI가 지상전에 미칠 영향은?|무인 체계는 수색·감시 등 위험 임무를 지원하고 후방의 운용자가 원격으로 통제할 수 있다. 유인 전력과 무인 전력의 협력이 중요해지며 안전·책임·통제 체계도 필요하다.`,
`한국형 삼축 체계의 세 요소와 역할은?|킬체인은 발사 징후에 대응하고, KAMD는 날아오는 미사일을 방어하며, KMPR은 공격에 대한 대량응징보복 개념이다.
도산안창호함의 기술적 의미와 탑재 전략 무기는?|국내 기술로 설계·건조한 3,000톤급 잠수함이며 SLBM 운용 능력과 연관된다. 자료에서는 한국을 세계 7번째 SLBM 보유국으로 소개한다.
천궁-II의 콜드 런치와 히트 투 킬 개념은?|콜드 런치는 가스 압력 등으로 유도탄을 먼저 발사관 밖으로 밀어 올린 뒤 점화하는 방식이다. 히트 투 킬은 요격체가 표적에 직접 충돌해 무력화하는 개념이다.
한국 주요 방산 기업 네 곳과 대표 분야는?|한화에어로스페이스는 K9 등 지상 무기, 현대로템은 K2 등 전투 차량, LIG넥스원은 정밀 유도무기, KAI는 FA-50·KF-21 등 항공기를 개발·생산한다.
고위력 재래식 미사일 기반 억제 전략을 설명하시오.|KMPR은 공격에 대한 높은 비용을 상대가 예상하도록 하는 억제 개념이다. 고위력 재래식 미사일을 이용한 대응 능력과 지휘·방어 체계의 신뢰성이 중요하다.`,
`AI 스마트 안경의 원리와 자료상 정확도는?|마이크로 수집한 음성을 AI가 실시간 문자로 변환해 안경 화면에 표시한다. 자료에서는 한국어 자막 정확도를 90% 이상으로 소개한다.
기존 단순 챗봇과 다른 AI 돌봄 대화의 특징은?|이전 대화의 맥락을 참고해 안부를 묻고 적절히 반응하며 정서적 교류를 돕는다. 실제 서비스에는 개인정보 보호와 사람의 돌봄 연계가 중요하다.
마을 미디어 크리에이터 교육의 이점은?|스마트폰 촬영·편집을 배워 직접 마을 이야기를 제작하고 공유하면서 사회 참여와 성취감을 얻을 수 있다.
키오스크 사용의 심리적 장벽과 지원 방법은?|낯선 기기와 뒤에서 기다리는 사람에 대한 부담이 사용 포기로 이어질 수 있다. 실생활 매장과 비슷한 환경에서 반복 연습하고 읽기 쉬운 화면과 도움 인력을 제공해야 한다.
농촌의 디지털 격차와 공공 통신 지원 필요성은?|통신망과 기기 접근성이 부족하면 보건·복지 서비스 이용에도 격차가 생긴다. 공공 Wi-Fi 같은 기본 통신 환경과 사용 교육을 함께 제공해야 한다.`
];
function parse(block,count,fields){
 const rows=block.trim().split('\n').map(line=>line.split('|'));
 if(rows.length!==count||rows.some(row=>row.length!==fields))throw new Error('문항 데이터 형식 오류');
 return rows;
}
const topics=names.map((name,i)=>({
 name,
 mc:parse(mcBlocks[i],25,7).map(([question,a,b,c,d,answer,explanation])=>({question,options:[a,b,c,d],answer:Number(answer)-1,explanation})),
 written:parse(writtenBlocks[i],5,2).map(([question,answer])=>({question,answer}))
}));
const state={topic:0,mode:'mc',index:0,selected:null,revealed:false};
const $=id=>document.getElementById(id);
const numbers=['①','②','③','④'];
const feedbackTitles=['feedback-correct','feedback-incorrect','feedback-written','feedback-pick','feedback-type'];
const topicList=$('topic-list'),options=$('options');
topics.forEach((topic,i)=>{
 const button=document.createElement('button');
 button.type='button';button.className='topic-button';
 button.textContent=`${String(i+1).padStart(2,'0')}  ${topic.name}`;
 button.addEventListener('click',()=>{if(state.topic===i)return;state.topic=i;state.index=0;reset()});
 topicList.append(button);
});
const optionButtons=numbers.map((number,i)=>{
 const button=document.createElement('button'),digit=document.createElement('span'),label=document.createElement('span');
 button.type='button';button.className='option';digit.className='option-number';digit.textContent=number;
 button.append(digit,label);
 button.addEventListener('click',()=>{if(state.revealed)return;state.selected=i;updateOptions();hideFeedback()});
 options.append(button);return{button,label};
});
function hideFeedback(){
 $('feedback').hidden=true;$('feedback').classList.remove('wrong');
 feedbackTitles.forEach(id=>$(id).hidden=true);
 $('feedback-body').textContent='';
}
function showFeedback(id,body='',wrong=false){
 feedbackTitles.forEach(key=>$(key).hidden=key!==id);
 $('feedback-body').textContent=body;
 $('feedback').classList.toggle('wrong',wrong);
 $('feedback').hidden=false;
}
function reset(){
 state.selected=null;state.revealed=false;
 $('written-answer').value='';hideFeedback();render();
}
function updateOptions(){
 const item=topics[state.topic].mc[state.index];
 optionButtons.forEach(({button,label},i)=>{
  label.textContent=item.options[i];
  button.classList.toggle('selected',state.selected===i);
  button.classList.toggle('correct',state.revealed&&i===item.answer);
  button.classList.toggle('incorrect',state.revealed&&state.selected===i&&i!==item.answer);
  button.setAttribute('aria-pressed',String(state.selected===i));
  button.disabled=state.revealed;
 });
}
function render(){
 const topic=topics[state.topic],items=topic[state.mode],item=items[state.index];
 [...topicList.children].forEach((button,i)=>{
  button.classList.toggle('active',i===state.topic);
  if(i===state.topic)button.setAttribute('aria-current','true');
  else button.removeAttribute('aria-current');
 });
 $('topic-kicker').textContent=`주제 ${String(state.topic+1).padStart(2,'0')} / ${topic.name}`;
 $('counter').textContent=`${state.mode==='mc'?'객관식':'주관식'} · ${state.index+1} / ${items.length}`;
 $('question').textContent=`Q${state.index+1}. ${item.question}`;
 const percent=Math.round((state.index+1)/items.length*100);
 $('progress-fill').style.width=percent+'%';
 $('progress-track').setAttribute('aria-valuenow',String(percent));
 ['mc','written'].forEach(mode=>{
  const button=$(`${mode}-mode`),active=mode===state.mode;
  button.classList.toggle('active',active);
  button.setAttribute('aria-pressed',String(active));
 });
 options.hidden=state.mode!=='mc';
 $('written-area').hidden=state.mode!=='written';
 if(state.mode==='mc')updateOptions();
 $('written-answer').disabled=state.revealed;
 $('submit').disabled=state.revealed;
 $('previous').disabled=state.index===0;
 $('next').disabled=state.index===items.length-1;
}
$('mc-mode').addEventListener('click',()=>{if(state.mode==='mc')return;state.mode='mc';state.index=0;reset()});
$('written-mode').addEventListener('click',()=>{if(state.mode==='written')return;state.mode='written';state.index=0;reset()});
$('previous').addEventListener('click',()=>{if(state.index>0){state.index--;reset()}});
$('next').addEventListener('click',()=>{if(state.index<topics[state.topic][state.mode].length-1){state.index++;reset()}});
$('submit').addEventListener('click',()=>{
 const item=topics[state.topic][state.mode][state.index];
 if(state.mode==='mc'&&state.selected===null){
  showFeedback('feedback-pick','',true);optionButtons[0].button.focus();return;
 }
 if(state.mode==='written'&&!$('written-answer').value.trim()){
  showFeedback('feedback-type','',true);$('written-answer').focus();return;
 }
 state.revealed=true;render();
 if(state.mode==='written'){
  showFeedback('feedback-written',`정답 및 모범 답안: ${item.answer}`);
 }else{
  const correct=state.selected===item.answer;
  showFeedback(correct?'feedback-correct':'feedback-incorrect',
   `정답: ${numbers[item.answer]} ${item.options[item.answer]}\n해설: ${item.explanation}`,!correct);
 }
});
render();
</script>
 </body>
</html>
