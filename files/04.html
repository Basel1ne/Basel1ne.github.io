이전 N번째 자극과 현재 자극을 비교하는 과제는?|엔백 훈련(N-back)|작업 기억을 사용합니다.
비네가 초기 지능검사를 개발한 목적은?|추가 학습 지원이 필요한 아동을 찾아 적절한 교육을 제공하기 위해서였다.|한 숫자로 사람의 가치를 서열화하려는 목적이 아닙니다.
《벨 곡선》의 결정론적 주장과 플린 효과·교육 사례를 비교하시오.|《벨 곡선》의 유전 결정론적 해석과 달리 플린 효과와 교육 개입 사례는 검사 점수가 환경의 영향을 받을 수 있음을 보여준다. 다만 개별 연구 결과를 모든 사람에게 동일하게 일반화해서는 안 된다.|유전과 환경을 함께 고려해야 합니다.
뇌 가소성과 청소년 IQ 변화 연구를 연결해 설명하시오.|뇌 가소성은 경험과 학습에 따라 신경 연결이 변화할 수 있다는 뜻이다. 청소년을 반복 측정한 연구에서는 IQ 검사 점수와 뇌 측정치가 함께 변하는 사례가 관찰되었다.|한 번의 IQ 점수가 평생의 능력을 고정하지 않습니다.`,
`가드너가 제안한 여러 지능 영역에 관한 이론은?|다중지능 이론|언어, 논리수학, 공간, 음악 등 여러 영역을 제시합니다.
뇌가 사용하는 신체 전체 에너지의 대략적인 비율은?|약 20%|휴식 중에도 뇌는 에너지를 사용합니다.
김연아 선수 사례에 제시된 두 지능은?|신체운동 지능과 자기성찰 지능|운동 수행과 자기 조절의 조합입니다.
단일 IQ 검사의 한계와 강점을 활용하는 교육법을 설명하시오.|IQ는 모든 능력을 하나의 숫자로 설명하기 어렵다. 학습자의 흥미와 강점을 활용해 어려워하는 영역에 접근할 다양한 활동을 설계할 수 있다.|강점은 다른 학습으로 가는 발판입니다.
뇌 크기와 지능의 관계에 관한 오해를 설명하시오.|뇌의 절대적인 크기만으로 인지 능력을 판단할 수 없다. 신경망의 연결과 기능, 발달 및 환경 등도 살펴야 한다.|아인슈타인의 뇌 사례도 단순 크기 비교의 한계를 보여줍니다.`,
`AI와 시·이미지를 주고받아 만든 DDP 작품은?|《메타 타임 인 블루(Meta Time in Blue)》|반복적인 인간·AI 협업으로 제작했습니다.
49분간 거울 속 시선 궤적을 기록한 기술은?|아이트래킹(Eye-tracking)|눈의 움직임을 데이터로 수집합니다.
《이경》에 사용된, 전기 신호로 투명도가 달라지는 재료는?|스마트 글라스|보임과 보이지 않음을 표현합니다.
카메라와 생성형 AI가 예술에 던진 질문을 비교하시오.|카메라는 회화가 사실을 그대로 재현하는 것 이상의 역할을 고민하게 했다. 생성형 AI는 이미지의 제작 과정, 작가의 역할, 프롬프트와 창작의 관계를 다시 묻게 한다.|새 기술은 표현법뿐 아니라 예술의 정의에도 영향을 줍니다.
기술 주도 시대에 예술의 역할을 서술하시오.|예술은 기술을 단순 도구로 소비하는 데 그치지 않고, 인간이 주체적으로 동시대의 의미 있는 질문을 만들고 여러 감각과 관점으로 소통하도록 돕는다.|기술과 인간의 관계를 성찰하게 합니다.`,
`어두워질 때 녹색·청색이 붉은색보다 상대적으로 밝게 보이는 현상은?|푸르키니에 현상|조도에 따라 시각계의 파장 민감도가 달라집니다.
빨간색을 오래 본 뒤 나타나는 녹색 계열 잔상은?|보색 잔상(음성 잔상)|수술실 색채 설명에도 활용됩니다.
한국산업표준의 기준으로 소개된 색체계는?|먼셀 색체계|색상·명도·채도의 속성을 사용합니다.
녹색·청색 도로 표지판과 해질녘의 시각 특성을 설명하시오.|해질녘처럼 조도가 낮아지면 푸르키니에 현상으로 청록색 계열이 붉은색보다 상대적으로 밝게 지각될 수 있다. 표지판 설계에는 가독성, 대비, 반사 성능과 실제 도로 기준도 함께 고려한다.|한 가지 현상만으로 모든 표지판 색을 결정하지는 않습니다.
서울 하늘색과 한강 은백색의 추출 과정을 비교하시오.|서울 하늘색은 가을철 한강변의 하늘 경관을 측정한 사례이고, 한강 은백색은 시민이 강을 건너며 자주 접하는 한강 풍경을 고려한 사례다.|자연환경 관찰과 시민의 경관 경험을 함께 반영합니다.`,
`복잡한 주기 파형을 사인파 성분으로 분석하는 정리는?|푸리에 정리|악기 음색의 주파수 성분을 이해하는 데 쓰입니다.
소리의 높낮이를 결정하는 요소와 진동수 단위는?|음고(Pitch), 진동수의 단위는 헤르츠(Hz)|초당 진동 횟수가 높을수록 높은 음으로 들립니다.
기본 진동수의 정수배에 나타나는 성분은?|배음(Harmonics)|F, 2F, 3F 등의 성분입니다.
조화음과 비조화음의 물리적 차이를 설명하시오.|조화음은 규칙적인 주기와 정수배에 가까운 배음 구조를 가진다. 비조화음은 그러한 규칙성이 약하거나 성분이 복잡하여 음고를 정하기 어려울 수 있다. 감정 반응은 소리의 맥락과 개인의 경험에 따라서도 달라진다.|특정 소리가 모든 사람에게 항상 같은 감정을 주는 것은 아닙니다.
클래식과 현대 음악의 소리 구성 및 표현 효과를 비교하시오.|현악기·관악기를 많이 쓰는 클래식 작품에서는 규칙적인 화음과 배음이 두드러질 수 있다. 록·전자음악 등은 강한 타악 리듬과 노이즈 성분을 활용해 긴장감이나 공동체적 에너지를 표현하기도 한다.|장르의 가치는 조화음·비조화음의 양만으로 결정되지 않습니다.`
];
const names=[
'31_02.mp4 - 측정 단위와 정밀 측정 기술','32_02.mp4 - 전기와 자기의 역사',
'33_02.mp4 - 아인슈타인과 상대성이론','34_02.mp4 - 화폐와 수학',
'35_02.mp4 - 불안과 뇌과학','36_02.mp4 - IQ와 환경적 변화',
'37_02.mp4 - IQ의 한계와 다중지능','38_02.mp4 - 기술과 예술의 대화',
'39_02.mp4 - 색채 과학과 디자인','40_02.mp4 - 음악과 소리의 물리'
];
function parse(block,count,fields){
  const rows=block.trim().split('\n').map(line=>line.split('|'));
  if(rows.length!==count||rows.some(row=>row.length!==fields))throw Error('문항 데이터 형식 오류');
  return rows;
}
const topics=names.map((name,i)=>({
  name,
  mc:parse(mcBlocks[i],25,7).map(([question,a,b,c,d,answer,explanation])=>({question,options:[a,b,c,d],answer:Number(answer)-1,explanation})),
  written:parse(writtenBlocks[i],5,3).map(([question,answer,point])=>({question,answer,point}))
}));
const state={topic:0,mode:'mc',index:0,selected:null,revealed:false};
const $=id=>document.getElementById(id);
const numbers=['①','②','③','④'];
const feedbackTitles=['feedback-correct','feedback-incorrect','feedback-written','feedback-pick','feedback-type'];
const topicList=$('topic-list'),options=$('options');
topics.forEach((topic,i)=>{
  const button=document.createElement('button');
  button.type='button';button.className='topic-button';
  button.textContent=`${String(i+1).padStart(2,'0')}  ${topic.name}`;
  button.addEventListener('click',()=>{if(state.topic===i)return;state.topic=i;state.index=0;reset()});
  topicList.append(button);
});
const optionButtons=numbers.map((number,i)=>{
  const button=document.createElement('button'),digit=document.createElement('span'),label=document.createElement('span');
  button.type='button';button.className='option';digit.className='option-number';digit.textContent=number;
  button.append(digit,label);
  button.addEventListener('click',()=>{if(state.revealed)return;state.selected=i;updateOptions();hideFeedback()});
  options.append(button);return{button,label};
});
function hideFeedback(){
  $('feedback').hidden=true;$('feedback').classList.remove('wrong');
  feedbackTitles.forEach(id=>$(id).hidden=true);
  $('feedback-body').textContent='';
}
function showFeedback(id,body='',wrong=false){
  feedbackTitles.forEach(key=>$(key).hidden=key!==id);
  $('feedback-body').textContent=body;
  $('feedback').classList.toggle('wrong',wrong);
  $('feedback').hidden=false;
}
function reset(){
  state.selected=null;state.revealed=false;
  $('written-answer').value='';hideFeedback();render();
}
function updateOptions(){
  const item=topics[state.topic].mc[state.index];
  optionButtons.forEach(({button,label},i)=>{
    label.textContent=item.options[i];
    button.classList.toggle('selected',state.selected===i);
    button.classList.toggle('correct',state.revealed&&i===item.answer);
    button.classList.toggle('incorrect',state.revealed&&state.selected===i&&i!==item.answer);
    button.setAttribute('aria-pressed',String(state.selected===i));
    button.disabled=state.revealed;
  });
}
function render(){
  const topic=topics[state.topic],items=topic[state.mode],item=items[state.index];
  [...topicList.children].forEach((button,i)=>{
    button.classList.toggle('active',i===state.topic);
    if(i===state.topic)button.setAttribute('aria-current','true');
    else button.removeAttribute('aria-current');
  });
  $('topic-kicker').textContent=`주제 ${String(state.topic+1).padStart(2,'0')} / ${topic.name}`;
  $('counter').textContent=`${state.mode==='mc'?'객관식':'주관식'} · ${state.index+1} / ${items.length}`;
  $('question').textContent=`Q${state.index+1}. ${item.question}`;
  const percent=Math.round((state.index+1)/items.length*100);
  $('progress-fill').style.width=percent+'%';
  $('progress-track').setAttribute('aria-valuenow',String(percent));
  ['mc','written'].forEach(mode=>{
    const button=$(`${mode}-mode`),active=mode===state.mode;
    button.classList.toggle('active',active);
    button.setAttribute('aria-pressed',String(active));
  });
  options.hidden=state.mode!=='mc';
  $('written-area').hidden=state.mode!=='written';
  if(state.mode==='mc')updateOptions();
  $('written-answer').disabled=state.revealed;
  $('submit').disabled=state.revealed;
  $('previous').disabled=state.index===0;
  $('next').disabled=state.index===items.length-1;
}
$('mc-mode').addEventListener('click',()=>{if(state.mode==='mc')return;state.mode='mc';state.index=0;reset()});
$('written-mode').addEventListener('click',()=>{if(state.mode==='written')return;state.mode='written';state.index=0;reset()});
$('previous').addEventListener('click',()=>{if(state.index>0){state.index--;reset()}});
$('next').addEventListener('click',()=>{
  if(state.index<topics[state.topic][state.mode].length-1){state.index++;reset()}
});
$('submit').addEventListener('click',()=>{
  const item=topics[state.topic][state.mode][state.index];
  if(state.mode==='mc'&&state.selected===null){
    showFeedback('feedback-pick','',true);optionButtons[0].button.focus();return;
  }
  if(state.mode==='written'&&!$('written-answer').value.trim()){
    showFeedback('feedback-type','',true);$('written-answer').focus();return;
  }
  state.revealed=true;render();
  if(state.mode==='written'){
    showFeedback('feedback-written',`정답 및 모범 답안: ${item.answer}\n해설: ${item.point}`);
  }else{
    const correct=state.selected===item.answer;
    showFeedback(correct?'feedback-correct':'feedback-incorrect',
      `정답: ${numbers[item.answer]} ${item.options[item.answer]}\n해설: ${item.explanation}`,!correct);
  }
});
render();
</script>
 </body>
</html>
