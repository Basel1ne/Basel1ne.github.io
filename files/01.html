function parseRows(block, count, width){
  const rows=block.trim().split('\n').map(row=>row.split('|'));
  if(rows.length!==count||rows.some(row=>row.length!==width))throw new Error('문항 데이터 형식 오류');
  return rows;
}
const topics=titles.map((title,i)=>({
  title,
  mc:parseRows(mcBlocks[i],25,7).map(([question,a,b,c,d,answer,explanation])=>({question,options:[a,b,c,d],answer:Number(answer)-1,explanation})),
  written:parseRows(writtenBlocks[i],5,2).map(([question,answer])=>({question,answer}))
}));
const state={topic:0,mode:'mc',revealedAll:false};
const $=id=>document.getElementById(id);
const digits=['①','②','③','④'];
const topicList=$('topic-list');
const list=$('question-list');

titles.forEach((title,index)=>{
  const button=document.createElement('button');
  button.type='button';
  button.className='topic-button';
  button.textContent=title;
  button.addEventListener('click',()=>{
    if(state.topic===index)return;
    state.topic=index;
    state.revealedAll=false;
    render();
  });
  topicList.append(button);
});

function reveal(card,item,selected,force=false){
  const feedback=card.querySelector('.feedback');
  if(state.mode==='written'){
    feedback.textContent='모범 답안: '+item.answer;
  }else{
    const correct=selected===item.answer;
    feedback.classList.toggle('wrong',selected!==null&&!correct);
    feedback.textContent=(selected===null||force?'정답: ':correct?'정답입니다!  정답: ':'다시 확인해 보세요.  정답: ')
      +digits[item.answer]+' '+item.options[item.answer]+'\n해설: '+item.explanation;
    card.querySelectorAll('.option').forEach((button,i)=>{
      button.classList.toggle('correct',i===item.answer);
      button.classList.toggle('incorrect',selected!==null&&i===selected&&i!==item.answer);
    });
  }
  feedback.hidden=false;
  card.dataset.revealed='true';
}
function createQuestion(item,index){
  const fragment=$(state.mode==='mc'?'mc-template':'written-template').content.cloneNode(true);
  const card=fragment.querySelector('.question-card');
  card.querySelector('.question-number').textContent='QUESTION '+String(index+1).padStart(2,'0');
  card.querySelector('.question-text').textContent=item.question;
  if(state.mode==='mc'){
    let selected=null;
    const options=card.querySelector('.options');
    item.options.forEach((text,i)=>{
      const button=document.createElement('button');
      button.type='button';
      button.className='option';
      button.setAttribute('aria-pressed','false');
      const number=document.createElement('span');
      number.className='option-number';
      number.textContent=digits[i];
      const label=document.createElement('span');
      label.textContent=text;
      button.append(number,label);
      button.addEventListener('click',()=>{
        selected=i;
        options.querySelectorAll('.option').forEach((option,j)=>{
          option.classList.toggle('selected',j===i);
          option.setAttribute('aria-pressed',String(j===i));
        });
        if(card.dataset.revealed==='true')reveal(card,item,selected);
      });
      options.append(button);
    });
    card.querySelector('.check-button').addEventListener('click',()=>{
      if(selected===null){
        const feedback=card.querySelector('.feedback');
        feedback.textContent='보기를 먼저 선택해 주세요.';
        feedback.classList.add('wrong');
        feedback.hidden=false;
        options.querySelector('button').focus();
        return;
      }
      reveal(card,item,selected);
    });
  }else{
    const textarea=card.querySelector('textarea');
    const label=card.querySelector('label');
    const id='written-'+state.topic+'-'+index;
    textarea.id=id;
    label.htmlFor=id;
    card.querySelector('.check-button').addEventListener('click',()=>{
      if(!textarea.value.trim()&&card.dataset.revealed!=='true'){
        const feedback=card.querySelector('.feedback');
        feedback.textContent='답안을 먼저 입력해 주세요.';
        feedback.classList.add('wrong');
        feedback.hidden=false;
        textarea.focus();
        return;
      }
      card.querySelector('.feedback').classList.remove('wrong');
      reveal(card,item,null);
    });
  }
  return fragment;
}
function render(){
  [...topicList.children].forEach((button,i)=>{
    const active=i===state.topic;
    button.classList.toggle('active',active);
    if(active)button.setAttribute('aria-current','true');
    else button.removeAttribute('aria-current');
  });
  $('topic-kicker').textContent='주제 '+String(state.topic+1).padStart(2,'0')+' / '+titles[state.topic];
  for(const mode of ['mc','written']){
    const button=$(mode+'-mode');
    button.classList.toggle('active',state.mode===mode);
    button.setAttribute('aria-pressed',String(state.mode===mode));
  }
  const items=topics[state.topic][state.mode];
  $('count').textContent=(state.mode==='mc'?'객관식':'주관식')+' · 전체 '+items.length+'문항';
  list.replaceChildren();
  const fragment=document.createDocumentFragment();
  items.forEach((item,index)=>fragment.append(createQuestion(item,index)));
  list.append(fragment);
  state.revealedAll=false;
  updateToggle();
}
function updateToggle(){
  $('show-all-label').hidden=state.revealedAll;
  $('hide-all-label').hidden=!state.revealedAll;
  $('toggle-all').setAttribute('aria-expanded',String(state.revealedAll));
}
$('mc-mode').addEventListener('click',()=>{if(state.mode!=='mc'){state.mode='mc';render()}});
$('written-mode').addEventListener('click',()=>{if(state.mode!=='written'){state.mode='written';render()}});
$('toggle-all').addEventListener('click',()=>{
  state.revealedAll=!state.revealedAll;
  const items=topics[state.topic][state.mode];
  [...list.children].forEach((card,i)=>{
    if(state.revealedAll){
      const selected=state.mode==='mc'
        ?[...card.querySelectorAll('.option')].findIndex(option=>option.classList.contains('selected'))
        :null;
      reveal(card,items[i],selected<0?null:selected,true);
    }else{
      card.querySelector('.feedback').hidden=true;
      card.querySelector('.feedback').classList.remove('wrong');
      card.querySelectorAll('.option').forEach(option=>{
        option.classList.remove('correct','incorrect');
      });
      delete card.dataset.revealed;
    }
  });
  updateToggle();
});
render();
</script>
