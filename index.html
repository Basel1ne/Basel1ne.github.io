<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basel1ne File Server</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --container-bg: #ffffff;
      --text-color: #212529;
      --border-color: #dee2e6;
      --link-color: #0366d6;
      --hover-bg: #f1f3f5;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }
    .server-container {
      max-width: 950px;
      margin: 0 auto;
      background: var(--container-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      padding: 20px;
    }
    h1 {
      font-size: 1.5rem;
      margin-top: 0;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
    }
    .breadcrumbs {
      font-size: 0.95rem;
      margin-bottom: 15px;
      padding: 8px 12px;
      background: var(--bg-color);
      border-radius: 4px;
    }
    .breadcrumbs a {
      color: var(--link-color);
      text-decoration: none;
      font-weight: bold;
    }
    .breadcrumbs a:hover { text-decoration: underline; }
    
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
    }
    th {
      background-color: var(--bg-color);
      font-weight: 600;
    }
    tr:hover { background-color: var(--hover-bg); }
    .icon { margin-right: 8px; font-style: normal; }
    .name-col { width: 50%; }
    .size-col { width: 20%; }
    .action-col { width: 30%; text-align: right; white-space: nowrap; }
    
    a.file-link {
      color: var(--link-color);
      text-decoration: none;
      font-weight: 500;
    }
    a.file-link:hover { text-decoration: underline; }
    
    .btn {
      display: inline-block;
      padding: 4px 8px;
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-left: 4px;
    }
    .btn-view {
      background: #0969da;
      color: white !important;
    }
    .btn-view:hover { background: #0451a5; }
    
    .btn-download {
      background: #2ea44f;
      color: white !important;
    }
    .btn-download:hover { background: #2c974b; }
  </style>
</head>
<body>

<div class="server-container">
  <h1>📁 Basel1ne HTTP File Server</h1>
  
  <div class="breadcrumbs" id="breadcrumbs">
    경로: <a href="javascript:void(0)" onclick="loadDirectory('')">Root</a>
  </div>

  <table>
    <thead>
      <tr>
        <th class="name-col">이름</th>
        <th class="size-col">크기</th>
        <th class="action-col">작업</th>
      </tr>
    </thead>
    <tbody id="file-list">
      <tr><td colspan="3">🔄 목록을 불러오는 중입니다...</td></tr>
    </tbody>
  </table>
</div>

<script>
  const REPO = 'Basel1ne/Basel1ne.github.io';
  const BASE_FOLDER = 'files';

  function loadDirectory(path) {
    const listTable = document.getElementById('file-list');
    const breadcrumbs = document.getElementById('breadcrumbs');
    
    listTable.innerHTML = '<tr><td colspan="3">🔄 로딩 중...</td></tr>';

    let pathParts = path ? path.split('/') : [];
    let breadcrumbHTML = '경로: <a href="javascript:void(0)" onclick="loadDirectory(\'\')">Root</a>';
    let currentPathAccumulator = '';
    
    pathParts.forEach(part => {
      currentPathAccumulator += (currentPathAccumulator ? '/' : '') + part;
      breadcrumbHTML += ` / <a href="javascript:void(0)" onclick="loadDirectory('${currentPathAccumulator}')">${part}</a>`;
    });
    breadcrumbs.innerHTML = breadcrumbHTML;

    const apiPath = path ? `${BASE_FOLDER}/${path}` : BASE_FOLDER;

    fetch(`https://api.github.com/repos/${REPO}/contents/${apiPath}`)
      .then(res => {
        if (!res.ok) throw new Error('폴더를 열 수 없습니다.');
        return res.json();
      })
      .then(items => {
        if (!Array.isArray(items) || items.length === 0) {
          listTable.innerHTML = '<tr><td colspan="3">📂 폴더가 비어 있습니다.</td></tr>';
          return;
        }

        let html = '';

        if (path) {
          const parentPath = pathParts.slice(0, -1).join('/');
          html += `
            <tr>
              <td colspan="3">
                <i class="icon">⤴️</i><a href="javascript:void(0)" onclick="loadDirectory('${parentPath}')" class="file-link"><b>[ 상위 폴더로 이동 ]</b></a>
              </td>
            </tr>
          `;
        }

        items.sort((a, b) => (b.type === 'dir') - (a.type === 'dir'));

        items.forEach(item => {
          if (item.name.startsWith('.')) return;

          if (item.type === 'dir') {
            const subPath = path ? `${path}/${item.name}` : item.name;
            html += `
              <tr>
                <td class="name-col"><i class="icon">📁</i><a href="javascript:void(0)" onclick="loadDirectory('${subPath}')" class="file-link"><strong>${item.name}/</strong></a></td>
                <td class="size-col">-</td>
                <td class="action-col">-</td>
              </tr>
            `;
          } else {
            const sizeKB = (item.size / 1024).toFixed(1);
            const sizeMB = (item.size / (1024 * 1024)).toFixed(2);
            const displaySize = item.size > 1024 * 1024 ? `${sizeMB} MB` : `${sizeKB} KB`;

            // raw.githubusercontent 대신 GitHub Pages 내부 상대 경로(item.path)로 주소 연결
            const fileUrl = encodeURI(item.path);

            html += `
              <tr>
                <td class="name-col">
                  <i class="icon">📄</i>
                  <a href="${fileUrl}" target="_blank" class="file-link">${item.name}</a>
                </td>
                <td class="size-col">${displaySize}</td>
                <td class="action-col">
                  <a href="${fileUrl}" target="_blank" class="btn btn-view" title="새 탭에서 바로보기">👁️ 보기</a>
                  <a href="${fileUrl}" download="${item.name}" class="btn btn-download" title="다운로드">📥 저장</a>
                </td>
              </tr>
            `;
          }
        });

        listTable.innerHTML = html;
      })
      .catch(err => {
        listTable.innerHTML = `<tr><td colspan="3" style="color:red;">⚠️ 오류: ${err.message} ('files' 폴더가 있는지 확인해주세요)</td></tr>`;
      });
  }

  loadDirectory('');
</script>

</body>
</html>
