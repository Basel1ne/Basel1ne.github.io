<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Basel1ne 자료실</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- 모던 테마 CSS -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    /* 자료실 커스텀 스타일 */
    :root {
      --theme-color: #0366d6; /* 메인 테마 색상 (GitHub Blue) */
    }
    .sidebar-nav strong { font-size: 1.05em; color: #24292e; }
    .markdown-section table { display: table; width: 100%; }
    .download-btn {
      display: inline-block;
      padding: 6px 12px;
      background-color: #2ea44f;
      color: white !important;
      border-radius: 6px;
      text-decoration: none !important;
      font-weight: bold;
      font-size: 0.9em;
    }
    .download-btn:hover { background-color: #2c974b; }
  </style>
</head>
<body>
  <div id="app">자료실을 불러오는 중입니다...</div>
  
  <script>
    window.$docsify = {
      name: '📦 Basel1ne 자료실',
      repo: 'https://github.com/Basel1ne/Basel1ne.github.io',
      loadSidebar: true,       /* _sidebar.md 파일 사용 */
      subMaxLevel: 2,          /* 목차 자동 생성 깊이 */
      auto2top: true,          /* 페이지 이동 시 상단 스크롤 */
      
      /* 실시간 검색 기능 설정 */
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '🔍 자료 검색 (파일명, 키워드)...',
        noData: '검색 결과가 없습니다.',
        depth: 3
      }
    }
  </script>
  
  <!-- Docsify 핵심 및 검색 플러그인 CDN -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
